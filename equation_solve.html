<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>특명 ! X 를 구하라 > 방정식을 풀어라</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 상단 헤더: 고대비 화이트 카드 */
    .top-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: 22px;
    }

    .header-main-title {
      font-size: 18.5px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    .header-main-title .highlight {
      color: #7c3aed;
    }

    .header-badge {
      background: #f5f3ff;
      color: #6d28d9;
      border: 2px solid #ddd6fe;
      font-size: 14.5px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 22px;
      box-shadow: 0 2px 6px rgba(109, 40, 217, 0.08);
      white-space: nowrap;
    }

    /* 메인 캔버스 래퍼 */
    .canvas-card {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 540px;
      background: #ffffff;
    }

    /* 하단 조작 내비게이션 바 (캔버스 바깥 독립 분리) */
    #ui-panel {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 6px 0;
    }

    .nav-btn {
      background: #7c3aed;
      color: #ffffff;
      border: none;
      padding: 13px 26px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }
    .nav-btn:hover:not(:disabled) {
      background: #6d28d9;
      transform: translateY(-1px);
    }
    .nav-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .nav-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }
    .nav-btn.home {
      background: #475569;
      box-shadow: 0 4px 12px rgba(71, 85, 105, 0.3);
    }
    .nav-btn.home:hover {
      background: #334155;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 상단 타이틀 헤더 바 -->
  <div class="top-header">
    <div class="header-left">
      <span class="header-icon">🎯</span>
      <span class="header-main-title"><span class="highlight">특명 ! X 를 구하라</span> &gt; 방정식을 풀어라</span>
    </div>
    <!-- 오른쪽 위 배지: 요청하신 '쫌 복잡한 5개 문제 도전!' -->
    <span class="header-badge" id="scene-badge">쫌 복잡한 5개 문제 도전!</span>
  </div>

  <!-- 캔버스 카드 -->
  <div class="canvas-card">
    <canvas id="canvas" width="960" height="540"></canvas>
  </div>

  <!-- 하단 내비게이션 바 -->
  <div id="ui-panel">
    <a href="index.html" class="nav-btn home" id="btn-home">🏠 목차</a>
    <button class="nav-btn" id="btn-prev" onclick="goPrev()">◀ 이전</button>
    <button class="nav-btn" id="btn-next" onclick="goNext()">다음 ▶</button>
  </div>
</div>

<script>
  // Web Audio 효과음 신디사이저
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'step') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'pop') {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.09);
        osc.frequency.setValueAtTime(783.99, now + 0.18);
        osc.frequency.setValueAtTime(1046.50, now + 0.27);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.18);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    } catch (e) {}
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const sceneBadge = document.getElementById('scene-badge');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');

  // 총 8개 씬 구성
  const totalScenes = 8;
  let currentScene = 0;
  let subStep = 0;

  const sceneTitles = [
    "쫌 복잡한 5개 문제 도전!",
    "2. [유형 1] 괄호가 들어간 방정식 (이항시 부호 주의 !)",
    "3. [유형 2] 비례식이 들어간 방정식 (내항곱 = 외항곱 !)",
    "4. [유형 3] 소수가 들어간 방정식 (소수와 분배법칙)",
    "5. [유형 4] 분수가 들어간 방정식 (항마다 다 곱해 !)",
    "6. [유형 5] 분수·소수·괄호 혼합 방정식 (끝판왕)",
    "7. 🏆 양변 x 방정식 5대 황금 원칙 총정리",
    "8. 🎯 [도전] 10대 함정 탈출 3초 스피드 퀴즈!"
  ];

  // 서브 스텝 맵
  // 0: 특명 안내 카드(0) -> Q1(1) -> Q2(2) -> Q3(3) -> Q4(4) -> Q5(5) -> 말풍선(6)
  // 1~5: 0(문제확인) -> 1(1단계&주의사항) -> 2(2단계) -> 3(3단계) -> 4(4단계정답) -> 5(친구들 꿀팁)
  // 6: 1(총정리)
  // 7: 퀴즈 10문제 (자체 진행)
  const subStepMaxMap = {
    0: 6,
    1: 5,
    2: 5,
    3: 5,
    4: 5,
    5: 5,
    6: 1,
    7: 0
  };

  // 🎯 실전 스피드 퀴즈 10문제 (사용자 요청: 소수 자릿수, 최소공배수 골고루, 괄호 처리 등 전면 보강!)
  const quizData = [
    {
      badge: "함정 1. 양변 동시 이항 부호 실수",
      eq: "3x - 5 = 5x + 3",
      question: "우변의 5x를 좌변으로, 좌변의 -5를 우변으로\n올바르게 이항한 식은?",
      options: [
        { text: "3x + 5x = 3 - 5", isCorrect: false, desc: "앗! 등호다리 건너갈 때 부호를 바꾸지 않았어! 💣" },
        { text: "3x - 5x = 3 + 5", isCorrect: true, desc: "정답! 등호다리 건너면 부호 바꿔! (+5x ➔ -5x, -5 ➔ +5) 🎯" }
      ],
      tip: "등호다리 건너면 부호 바꿔! (+ ➔ -, - ➔ +)"
    },
    {
      badge: "함정 2. 비례식 괄호 묶기 누락",
      eq: "(x + 2) : 4 = (2x - 1) : 3",
      question: "내항곱 = 외항곱 으로 바꿀 때\n올바른 식은?",
      options: [
        { text: "3(x + 2) = 4(2x - 1)", isCorrect: true, desc: "정답! 내항곱 = 외항곱! 항이 2개면 반드시 괄호로 묶어야 해! 🎯" },
        { text: "3x + 2 = 4 × 2x - 1", isCorrect: false, desc: "앗! 괄호로 묶지 않으면 상수항 곱하기가 누락돼 💣" }
      ],
      tip: "비례식은 내항곱 = 외항곱! 항이 2개면 반드시 괄호로~"
    },
    {
      badge: "함정 3. 소수 자릿수가 다를 때 곱할 수",
      eq: "0.25x - 0.3 = 1.2",
      question: "소수를 모두 정수로 만들기 위해\n양변에 곱해야 하는 가장 알맞은 수는?",
      options: [
        { text: "양변에 100을 곱한다", isCorrect: true, desc: "정답! 0.25가 소수 둘째 자리이므로 100을 곱해야 모두 정수가 돼! 🎯" },
        { text: "양변에 10을 곱한다", isCorrect: false, desc: "앗! 10만 곱하면 0.25는 정수가 못 된다 ㅜㅜ 💣" }
      ],
      tip: "소수 자릿수가 다를 땐 가장 자릿수가 큰 소수에 맞춰 100을 곱한다!"
    },
    {
      badge: "함정 4. 소수 괄호 밖 대표에만 곱하기",
      eq: "0.1(x + 6) = 2",
      question: "양변에 10을 곱하여 소수를 없앨 때\n좌변의 올바른 모습은?",
      options: [
        { text: "1(10x + 60)", isCorrect: false, desc: "앗! 괄호 밖 0.1에 곱했으면 괄호 속까지 또 곱하면 안 돼! 💣" },
        { text: "1(x + 6)", isCorrect: true, desc: "정답! 괄호 밖 대표 0.1에만 10을 곱하고 괄호는 그대로 둔다! 🎯" }
      ],
      tip: "양변에 100이나 10을 곱할 땐 괄호 밖 대표에만 곱한다!"
    },
    {
      badge: "함정 5. 괄호를 풀어야 이항 자격 생김!",
      eq: "2(x - 3) = 4x",
      question: "괄호 속의 x를 이항하기 위해\n가장 먼저 해야 할 일은?",
      options: [
        { text: "분배법칙으로 괄호를 먼저 푼다", isCorrect: true, desc: "정답! 2x - 6 = 4x 로 괄호를 먼저 풀어야 비로소 이항 자격이 생겨! 🎯" },
        { text: "괄호 속 -3을 우변으로 바로 넘긴다", isCorrect: false, desc: "앗! 괄호 속에 갇힌 x와 수는 밖으로 바로 이항할 수 없어! 💣" }
      ],
      tip: "원칙 ①: 괄호를 풀어야 이항 자격 생김!"
    },
    {
      badge: "함정 6. 항마다 다 곱해! (상수항 주의)",
      eq: "x / 3 = (x - 2) / 2 + 1",
      question: "분모를 없애기 위해 양변에 6을 곱할 때\n우변의 올바른 모습은?",
      options: [
        { text: "3(x - 2) + 1", isCorrect: false, desc: "앗! 분수만 6 곱하면 땡! 뒤의 상수항 +1에도 6을 곱해야 해! 💣" },
        { text: "3(x - 2) + 6", isCorrect: true, desc: "정답! 항마다 다 곱해! 숫자 홀로 있는 상수항도 꼭꼭! 🎯" }
      ],
      tip: "원칙 ④: 항마다 다 곱해! (숫자 홀로 있는 상수항도 꼭꼭!)"
    },
    {
      badge: "함정 7. 소수와 분수가 섞였을 때 통일",
      eq: "0.5x - 1 = (1/3)x",
      question: "소수와 분수가 섞여 있을 때\n가장 좋은 해결 전략은?",
      options: [
        { text: "0.5를 분수 1/2로 통일한다", isCorrect: true, desc: "정답! 분수로 통일하면 분모 2와 3의 공배수 6을 한눈에 곱할 수 있어! 🎯" },
        { text: "1/3을 소수 0.333... 으로 바꾼다", isCorrect: false, desc: "앗! 순환소수가 되어 계산이 훨씬 엉켜버려요 💣" }
      ],
      tip: "소수와 분수가 섞이면 분수로 만들어 한 가지로 통일!"
    },
    {
      badge: "함정 8. 최소공배수 양변에 골고루 곱하기",
      eq: "(x - 1) / 2 - (x + 1) / 4 = 3",
      question: "분모 2와 4의 최소공배수인 4를 곱할 때\n우변의 올바른 값은?",
      options: [
        { text: "우변은 12 (3 × 4)", isCorrect: true, desc: "정답! 좌변뿐만 아니라 우변의 상수항 3에도 4를 꼭 곱해야 해! 🎯" },
        { text: "우변은 그대로 3", isCorrect: false, desc: "앗! 우변에 4 곱하기를 빼먹으면 등식이 깨져요 💣" }
      ],
      tip: "최소공배수는 좌변과 우변의 모든 항에 공평하게 곱한다!"
    },
    {
      badge: "함정 9. 괄호 앞 마이너스 분배 부호 폭탄",
      eq: "5 - (2x - 3) = x + 2",
      question: "좌변의 괄호 앞 마이너스(-)를 분배할 때\n올바른 좌변의 모습은?",
      options: [
        { text: "5 - 2x + 3", isCorrect: true, desc: "정답! -(-3) = +3 이 되므로 부호가 반전되어 5 - 2x + 3 이 맞아! 🎯" },
        { text: "5 - 2x - 3", isCorrect: false, desc: "앗! 괄호 속 -3의 부호를 바꾸지 않아 틀렸어 💣" }
      ],
      tip: "괄호 앞 마이너스는 괄호 속 모든 항의 부호를 반대로 뒤집는다!"
    },
    {
      badge: "함정 10. 마지막 음수 x 계수 부호 처리",
      eq: "-x = 5",
      question: "마지막 줄에 -x = 5 가 나왔을 때\n최종 미지수 x의 값은?",
      options: [
        { text: "x = 5", isCorrect: false, desc: "앗! -x 앞의 마이너스(-) 부호를 반전시키지 않았어! 💣" },
        { text: "x = -5", isCorrect: true, desc: "정답! 양변에 -1을 곱해 x = -5 로 부호 반전! 🎯" }
      ],
      tip: "-x는 (-1)×x 이므로 양변에 -1을 곱하면 x = -5 가 된다!"
    }
  ];

  let quizQuestionIdx = 0;
  let quizSelectedOption = null;
  let quizFeedback = null;
  let quizCompleted = false;

  function updateUI() {
    if (sceneBadge) {
      sceneBadge.innerText = sceneTitles[currentScene];
    }

    btnPrev.disabled = (currentScene === 0 && subStep === 0);

    if (currentScene === 7) {
      if (quizCompleted) {
        btnNext.disabled = false;
        btnNext.innerText = "처음으로 ↺";
        btnNext.style.background = "#10b981";
      } else {
        if (quizFeedback && quizFeedback.isCorrect) {
          btnNext.disabled = false;
          btnNext.innerText = (quizQuestionIdx < quizData.length - 1) ? `다음 퀴즈 (Q${quizQuestionIdx + 2}) ▶` : "최종 결과 확인 🏆";
          btnNext.style.background = "#7c3aed";
        } else {
          btnNext.disabled = true;
          btnNext.innerText = "정답을 골라봐 👇";
          btnNext.style.background = "";
        }
      }
      return;
    }

    btnNext.style.background = "";

    const maxSub = subStepMaxMap[currentScene] || 0;
    if (currentScene === 0) {
      if (subStep === 0) {
        btnNext.disabled = false;
        btnNext.innerText = "특명 시작! 5개 문제 보기 ▶";
      } else if (subStep < 5) {
        btnNext.disabled = false;
        btnNext.innerText = `다음 유형 보기 (${subStep}/5) ▶`;
      } else if (subStep === 5) {
        btnNext.disabled = false;
        btnNext.innerText = "친구들 꿀팁 듣기 ▶";
      } else {
        btnNext.disabled = false;
        btnNext.innerText = "1번 괄호 방정식 풀기 ▶";
      }
    } else if (currentScene >= 1 && currentScene <= 5) {
      if (subStep < maxSub) {
        btnNext.disabled = false;
        const stepLabels = ["1단계 풀이 보기 ▶", "2단계 풀이 보기 ▶", "3단계 풀이 보기 ▶", "4단계 풀이 보기 ▶", "친구들 꿀팁 듣기 ▶"];
        btnNext.innerText = stepLabels[subStep] || `다음 풀이 단계 (${subStep + 1}/${maxSub}) ▶`;
      } else {
        btnNext.disabled = false;
        btnNext.innerText = (currentScene === 5) ? "양변 x 5대 원칙 총정리 ▶" : `유형 ${currentScene + 1} 풀기 ▶`;
      }
    } else if (currentScene === 6) {
      btnNext.disabled = false;
      btnNext.innerText = "실전 10대 퀴즈 도전! 🎯";
      btnNext.style.background = "#f97316";
    }
  }

  function goNext() {
    playSound('step');
    const maxSub = subStepMaxMap[currentScene] || 0;

    if (currentScene === 7) {
      if (quizCompleted) {
        currentScene = 0;
        subStep = 0;
        quizQuestionIdx = 0;
        quizSelectedOption = null;
        quizFeedback = null;
        quizCompleted = false;
        updateUI();
        return;
      }
      if (quizFeedback && quizFeedback.isCorrect) {
        if (quizQuestionIdx < quizData.length - 1) {
          quizQuestionIdx++;
          quizSelectedOption = null;
          quizFeedback = null;
        } else {
          quizCompleted = true;
          playSound('success');
        }
      }
      updateUI();
      return;
    }

    if (subStep < maxSub) {
      subStep++;
    } else {
      if (currentScene < totalScenes - 1) {
        currentScene++;
        subStep = 0;
      }
    }
    updateUI();
  }

  function goPrev() {
    playSound('pop');
    if (currentScene === 7) {
      if (quizQuestionIdx > 0 && !quizCompleted) {
        quizQuestionIdx--;
        quizSelectedOption = null;
        quizFeedback = null;
        updateUI();
        return;
      }
      currentScene = 6;
      subStep = subStepMaxMap[6];
      updateUI();
      return;
    }

    if (subStep > 0) {
      subStep--;
    } else {
      if (currentScene > 0) {
        currentScene--;
        subStep = subStepMaxMap[currentScene] || 0;
      }
    }
    updateUI();
  }

  function loadScene(sceneIdx, stepIdx = 0) {
    currentScene = Math.max(0, Math.min(totalScenes - 1, sceneIdx));
    const maxSub = subStepMaxMap[currentScene] || 0;
    subStep = Math.max(0, Math.min(maxSub, stepIdx));
    updateUI();
  }

  // 정통 분수 드로잉 (분모, 분자, 분수선)
  function drawFraction(ctx, num, den, x, y, size = 18, color = "#0f172a") {
    ctx.save();
    ctx.font = `bold ${Math.round(size * 0.85)}px 'Pretendard', sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.strokeStyle = color;

    const numW = ctx.measureText(num).width;
    const denW = ctx.measureText(den).width;
    const barW = Math.max(numW, denW) + 8;

    ctx.textBaseline = "bottom";
    ctx.fillText(num, x, y - 2);

    ctx.lineWidth = Math.max(1.8, Math.round(size * 0.08));
    ctx.beginPath();
    ctx.moveTo(x - barW / 2, y);
    ctx.lineTo(x + barW / 2, y);
    ctx.stroke();

    ctx.textBaseline = "top";
    ctx.fillText(den, x, y + 3);

    ctx.restore();
    return barW;
  }

  // 귀여운 캐릭터 얼굴 (주인공 & 수학 친구)
  function drawComicFace(ctx, x, y, isFriend = false, mood = 'smile') {
    ctx.save();
    ctx.translate(x, y);

    const r = 24;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = isFriend ? "#7c3aed" : "#1e293b";
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (!isFriend) {
      // 주인공 (주황 머리)
      ctx.fillStyle = "#f97316";
      ctx.strokeStyle = "#c2410c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -6, r, Math.PI * 1.1, Math.PI * 1.9);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-16, -14); ctx.lineTo(-6, -26); ctx.lineTo(4, -14); ctx.lineTo(14, -24); ctx.lineTo(18, -12);
      ctx.fillStyle = "#ea580c"; ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#1e293b";
      if (mood === 'shock') {
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(-8, -4, 4.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(8, -4, 4.5, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(-8, -4, 3, 0, Math.PI * 2); ctx.arc(8, -4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
        ctx.beginPath(); ctx.arc(-14, 4, 4, 0, Math.PI * 2); ctx.arc(14, 4, 4, 0, Math.PI * 2); ctx.fill();
      }

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === 'shock') {
        ctx.arc(0, 8, 4.5, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.arc(0, 5, 8, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      }
    } else {
      // 수학 친구 (보라 헤어)
      ctx.fillStyle = "#8b5cf6";
      ctx.strokeStyle = "#6d28d9";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -5, r, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-16, -16); ctx.quadraticCurveTo(8, -32, 28, -14); ctx.quadraticCurveTo(8, -20, -16, -16);
      ctx.fillStyle = "#7c3aed"; ctx.fill(); ctx.stroke();

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-12, -2); ctx.lineTo(-8, -6); ctx.lineTo(-4, -2);
      ctx.stroke();

      ctx.fillStyle = "#1e293b";
      ctx.beginPath(); ctx.arc(8, -4, 3.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "rgba(168, 85, 247, 0.25)";
      ctx.beginPath(); ctx.arc(-13, 6, 4, 0, Math.PI * 2); ctx.arc(13, 6, 4, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, 5, 9, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 친구들 티키타카 말풍선
  function drawCompactBubble(ctx, targetX, targetY, text, isFriend = false) {
    ctx.save();

    ctx.font = "bold 13.5px 'Pretendard', sans-serif";
    const lines = text.split("\n");
    let maxW = 0;
    lines.forEach(l => {
      const w = ctx.measureText(l).width;
      if (w > maxW) maxW = w;
    });

    const padX = 14;
    const padY = 9;
    const lineH = 18;
    const bubbleW = maxW + padX * 2;
    const bubbleH = lines.length * lineH + padY * 2;

    let bx, by;
    if (!isFriend) {
      bx = targetX + 34;
      by = targetY - bubbleH / 2;
    } else {
      bx = targetX - 34 - bubbleW;
      by = targetY - bubbleH / 2;
    }

    // 말풍선 배경
    ctx.fillStyle = isFriend ? "#f5f3ff" : "#fffbeb";
    ctx.strokeStyle = isFriend ? "#7c3aed" : "#f59e0b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bubbleW, bubbleH, 12);
    ctx.fill(); ctx.stroke();

    // 꼬리표
    ctx.beginPath();
    if (!isFriend) {
      ctx.moveTo(bx, targetY - 4);
      ctx.lineTo(bx - 10, targetY);
      ctx.lineTo(bx, targetY + 6);
    } else {
      ctx.moveTo(bx + bubbleW, targetY - 4);
      ctx.lineTo(bx + bubbleW + 10, targetY);
      ctx.lineTo(bx + bubbleW, targetY + 6);
    }
    ctx.fillStyle = isFriend ? "#f5f3ff" : "#fffbeb";
    ctx.fill(); ctx.stroke();

    // 텍스트 출력
    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    lines.forEach((line, idx) => {
      ctx.fillText(line, bx + padX, by + padY + idx * lineH + lineH / 2);
    });

    ctx.restore();
  }

  // ==========================================
  // 메인 렌더링 루프
  // ==========================================
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 미세 그리드 배경
    ctx.fillStyle = "#fafafa";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#f1f5f9";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    if (currentScene === 0) {
      renderScene0();
    } else if (currentScene === 1) {
      renderSceneProblem1();
    } else if (currentScene === 2) {
      renderSceneProblem2();
    } else if (currentScene === 3) {
      renderSceneProblem3();
    } else if (currentScene === 4) {
      renderSceneProblem4();
    } else if (currentScene === 5) {
      renderSceneProblem5();
    } else if (currentScene === 6) {
      renderSceneSummary();
    } else if (currentScene === 7) {
      renderSceneQuiz();
    }

    requestAnimationFrame(render);
  }

  // ==========================================

  function drawProblemHeader(title, typeNum, subTitle, eqStr, fracMode = null) {

    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1.5;

    ctx.roundRect(40, 20, 880, 75, 14);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#7c3aed";
    ctx.beginPath();
    ctx.roundRect(58, 32, 70, 26, 6);

  // ==========================================
  // [겹침 완벽 해결] 단계별 풀이 카드 드로잉 함수
  // 3단 레이아웃 (1행:태그+설명 / 2행:식 단독 / 3행:주의팁 단독)
  // coloredParts 지원으로 곱해진 6을 빨간색 등 차별화 가능!
  // ==========================================
  function drawStepCards(steps, startY = 105, cardW = 425, cardH = 74) {
    for (let i = 0; i < steps.length; i++) {
      const y = startY + i * 78;

      if (subStep <= i) {
        ctx.fillStyle = "#f8fafc";
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(50, y, cardW, cardH, 10);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#94a3b8";
        ctx.font = "bold 13.5px 'Pretendard', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🔒 [${steps[i].tag} 풀이 보기 ▶] 버튼을 누르면 공개!`, 50 + cardW / 2, y + 42);
        continue;
      }

      const s = steps[i];
      ctx.fillStyle = "#ffffff";

      return;
    }

    const q = quizData[quizQuestionIdx];

    // 상단 퀴즈 진행 바
    ctx.fillStyle = "#7c3aed";
    ctx.font = "bold 15px 'Pretendard', sans-serif";
    ctx.textAlign = "left";

    ctx.font = "14px 'Pretendard', sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(`진행: ${quizQuestionIdx + 1} / ${quizData.length}`, 900, 42);

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(50, 60, 860, 130, 14);
    ctx.fill(); ctx.stroke();

    // 수식
    ctx.fillStyle = "#7c3aed";
    ctx.font = "bold 24px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(q.eq, cx, 100);

    // 질문 텍스트
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 16px 'Pretendard', sans-serif";
    const qLines = q.question.split("\n");
    if (qLines.length === 1) {
      ctx.fillText(qLines[0], cx, 145);
    } else {
      ctx.fillText(qLines[0], cx, 136);
      ctx.fillText(qLines[1], cx, 162);
    }

    // 선택지 버튼 2개
    const optY = 210;
    const optW = 415;
    const optH = 75;

    for (let i = 0; i < q.options.length; i++) {
      const opt = q.options[i];
      const optX = (i === 0) ? 55 : 490;

      let bgColor = "#f8fafc";
      let borderColor = "#cbd5e1";
      let textColor = "#1e293b";

      if (quizSelectedOption !== null) {
        if (i === quizSelectedOption) {
          if (opt.isCorrect) {
            bgColor = "#dcfce7";
            borderColor = "#22c55e";
            textColor = "#15803d";
          } else {
            bgColor = "#fee2e2";
            borderColor = "#ef4444";
            textColor = "#b91c1c";
          }
        } else if (opt.isCorrect && quizSelectedOption !== null) {
          bgColor = "#f0fdf4";
          borderColor = "#86efac";
          textColor = "#16a34a";
        }
      }

      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(optX, optY, optW, optH, 12);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.font = "bold 16px 'Pretendard', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`보기 ${i + 1}.   ${opt.text}`, optX + optW / 2, optY + 44);
    }

    // 피드백 카드
    if (quizFeedback) {
      const fbY = 300;
      ctx.fillStyle = quizFeedback.isCorrect ? "#f0fdf4" : "#fef2f2";
      ctx.strokeStyle = quizFeedback.isCorrect ? "#22c55e" : "#ef4444";

      ctx.beginPath();
      ctx.roundRect(55, fbY, 850, 72, 10);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = quizFeedback.isCorrect ? "#15803d" : "#b91c1c";
      ctx.font = "bold 15px 'Pretendard', sans-serif";
      ctx.textAlign = "left";

      ctx.font = "14.5px 'Pretendard', sans-serif";

      ctx.fillStyle = "#475569";
      ctx.font = "13px 'Pretendard', sans-serif";
      ctx.fillText(`💡 꿀팁: ${q.tip}`, 75, fbY + 54);
    }

    // 하단 캐릭터
    if (!quizFeedback) {
      drawComicFace(ctx, 65, 465, false, 'thinking');
      drawCompactBubble(ctx, 65, 465, "함정에 안 걸리려면 보기 둘 중\n어느 게 맞는지 신중하게 골라야 해!", false);

        drawComicFace(ctx, 65, 465, false, 'smile');
        drawCompactBubble(ctx, 65, 465, "와 맞혔다! 함정 싹 피해갔어 ㅋㅋㅋ\n다음 문제도 바로 가보자!", false);

        drawComicFace(ctx, 895, 465, true, 'smile');
        drawCompactBubble(ctx, 895, 465, "오 대박! 원칙 완벽하게 꿰뚫었네!\n아래 [다음 퀴즈 ▶] 버튼 눌러봐 🚀", true);
      } else {
        drawComicFace(ctx, 65, 465, false, 'shock');
        drawCompactBubble(ctx, 65, 465, "아차! 바로 그 함정에 걸려버렸네 😱\n다시 확인하고 기억해야지!", false);

        drawComicFace(ctx, 895, 465, true, 'smile');
        drawCompactBubble(ctx, 895, 465, "괜찮아! 오답 피드백 읽고 다시 골라봐!\n실수하면서 실력이 쑥쑥 크는 거야 💪", true);
      }
    }
  }

  // 캔버스 클릭 이벤트 (퀴즈 선택지)
  canvas.addEventListener('click', function(e) {
    if (currentScene !== 7 || quizCompleted) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    const optY = 210;
    const optW = 415;
    const optH = 75;

    // 보기 1
    if (clickX >= 55 && clickX <= 55 + optW && clickY >= optY && clickY <= optY + optH) {
      selectQuizOption(0);
    }
    // 보기 2
    else if (clickX >= 490 && clickX <= 490 + optW && clickY >= optY && clickY <= optY + optH) {
      selectQuizOption(1);
    }
  });

  function selectQuizOption(optIdx) {
    quizSelectedOption = optIdx;
    const q = quizData[quizQuestionIdx];
    const opt = q.options[optIdx];

    if (opt.isCorrect) {
      playSound('success');
      quizFeedback = { isCorrect: true, desc: opt.desc };
    } else {
      playSound('wrong');
      quizFeedback = { isCorrect: false, desc: opt.desc };
    }
    updateUI();
  }

  // 키보드 방향키 단축키 지원
  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      if (!btnNext.disabled) goNext();
    } else if (e.key === 'ArrowLeft') {
      if (!btnPrev.disabled) goPrev();
    }
  });

  // URL 해시 및 쿼리 파라미터 지원 (#scene=N&step=M)
  let sParam = NaN, stepParam = NaN;
  if (window.location.hash) {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    sParam = parseInt(hashParams.get('scene'), 10);
    stepParam = parseInt(hashParams.get('step'), 10);
  }
  if (isNaN(sParam) && window.location.search) {
    const urlParams = new URLSearchParams(window.location.search);
    sParam = parseInt(urlParams.get('scene'), 10);
    stepParam = parseInt(urlParams.get('step'), 10);
  }
  loadScene(!isNaN(sParam) ? sParam : 0, !isNaN(stepParam) ? stepParam : 0);
  render();
</script>
</body>
</html>

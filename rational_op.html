<!DOCTYPE html>

    .header-main-title .highlight-red {

      gap: 8px;
      align-items: center;

    .prob-tab {

    }

    }

      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;

      transition: all 0.2s ease;

      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);

      background: #ffffff;

      justify-content: center;
      align-items: center;

  // ==========================================
  // Web Audio 신디사이저 (효과음)
  // ==========================================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.06);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'step') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'fanfare') {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const subOsc = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          subOsc.connect(subGain);
          subGain.connect(audioCtx.destination);
          subOsc.frequency.value = freq;
          subGain.gain.setValueAtTime(0.2, now + idx * 0.09);
          subGain.gain.linearRampToValueAtTime(0, now + idx * 0.09 + 0.24);
          subOsc.start(now + idx * 0.09);
          subOsc.stop(now + idx * 0.09 + 0.24);
        });
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.18);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    } catch (e) {}
  }

  // ==========================================
  // 드로잉 헬퍼 함수

  // 진짜 수학 분수 드로잉
  function drawFraction(ctx, num, den, x, y, size = 18, color = "#0f172a") {
    ctx.save();
    ctx.font = `bold ${Math.round(size * 0.82)}px 'Pretendard', sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.strokeStyle = color;

    const numW = ctx.measureText(num.toString()).width;
    const denW = ctx.measureText(den.toString()).width;
    const barW = Math.max(numW, denW) + 12;

    // 분자
    ctx.textBaseline = "bottom";
    ctx.fillText(num.toString(), x, y - 2);

    // 분수선
    ctx.lineWidth = Math.max(1.8, Math.round(size * 0.08));
    ctx.beginPath();
    ctx.moveTo(x - barW / 2, y);
    ctx.lineTo(x + barW / 2, y);
    ctx.stroke();

    // 분모
    ctx.textBaseline = "top";
    ctx.fillText(den.toString(), x, y + 3);

    ctx.restore();
    return barW;
  }

  // [+] 파랑 / [-] 빨강 부호 컬러 텍스트 & 거듭제곱(^2 / ²) 지원
  function drawColoredMath(ctx, str, x, y, defaultColor = "#0f172a", align = "left") {
    if (!str) return 0;
    ctx.save();
    const baseFont = ctx.font;
    const matchSize = baseFont.match(/(\d+)px/);
    const numSize = matchSize ? parseInt(matchSize[1], 10) : 16;
    const superFont = baseFont.replace(/(\d+)px/, `${Math.max(10, Math.round(numSize * 0.7))}px`);

    const tokens = [];
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      if (ch === '+' || ch === '-') {
        tokens.push({ text: ch, isSymbol: true, isPlus: (ch === '+') });
        i++;
      } else if (ch === '^' && i + 1 < str.length) {
        tokens.push({ text: str[i + 1], isSuper: true });
        i += 2;
      } else if (ch === '²' || ch === '³') {
        tokens.push({ text: (ch === '²' ? '2' : '3'), isSuper: true });
        i++;
      } else {
        let j = i + 1;
        while (j < str.length && str[j] !== '+' && str[j] !== '-' && str[j] !== '^' && str[j] !== '²' && str[j] !== '³') {
          j++;
        }
        tokens.push({ text: str.substring(i, j), isSymbol: false });
        i = j;
      }
    }

    let totalW = 0;
    tokens.forEach(t => {
      if (t.isSuper) {
        ctx.font = superFont;
        t.w = ctx.measureText(t.text).width;
        ctx.font = baseFont;
      } else {
        ctx.font = baseFont;
        t.w = ctx.measureText(t.text).width;
      }
      totalW += t.w;
    });

    let curX = (align === "center") ? x - totalW / 2 : (align === "right" ? x - totalW : x);
    ctx.textAlign = "left";

    tokens.forEach(t => {
      if (t.isSuper) {
        ctx.font = superFont;
        ctx.fillStyle = defaultColor;
        ctx.fillText(t.text, curX, y - Math.round(numSize * 0.35));
        ctx.font = baseFont;
      } else if (t.isSymbol) {
        ctx.fillStyle = t.isPlus ? "#2563eb" : "#dc2626";
        ctx.fillText(t.text, curX, y);
      } else {
        ctx.fillStyle = defaultColor;
        ctx.fillText(t.text, curX, y);
      }
      curX += t.w;
    });

    ctx.restore();
    return totalW;
  }

  // 캐릭터 얼굴 및 손가락 가리키는 포즈 드로잉
  function drawPointingCharacter(ctx, x, y, pointingLeft = true) {
    ctx.save();
    ctx.translate(x, y);

    // 몸통 / 어깨
    ctx.fillStyle = "#f97316";
    ctx.strokeStyle = "#c2410c";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(0, 32, 22, 14, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // 얼굴 (반경 24)
    const r = 24;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // 주황색 앞머리
    ctx.fillStyle = "#f97316";
    ctx.strokeStyle = "#c2410c";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -6, r, Math.PI * 1.1, Math.PI * 1.9);
    ctx.fill(); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-16, -14); ctx.lineTo(-7, -26); ctx.lineTo(4, -14); ctx.lineTo(14, -24); ctx.lineTo(18, -12);
    ctx.fillStyle = "#ea580c"; ctx.fill(); ctx.stroke();

    // 두 눈
    ctx.fillStyle = "#1e293b";
    ctx.beginPath(); ctx.arc(-8, -3, 3.2, 0, Math.PI * 2); ctx.arc(8, -3, 3.2, 0, Math.PI * 2); ctx.fill();

    // 볼터치
    ctx.fillStyle = "rgba(239, 68, 68, 0.28)";
    ctx.beginPath(); ctx.arc(-14, 5, 4, 0, Math.PI * 2); ctx.arc(14, 5, 4, 0, Math.PI * 2); ctx.fill();

    // 웃는 입
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 5, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    // 가리키는 팔과 손가락
    if (pointingLeft) {
      ctx.strokeStyle = "#ea580c";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-14, 28);
      ctx.lineTo(-42, 14);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-45, 12, 7, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.roundRect(-58, 8, 14, 6.5, 3);
      ctx.fill(); ctx.stroke();
    }

    ctx.restore();
  }

  // 캐릭터 말풍선 대화 헬퍼
  function drawComicBubble(ctx, bx, by, bw, bh, text, fontSize = 16) {
    ctx.save();
    ctx.font = `bold ${fontSize}px 'Pretendard', sans-serif`;

    ctx.fillStyle = "#fffbeb";
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 14);
    ctx.fill(); ctx.stroke();

    // 말풍선 꼬리
    ctx.beginPath();
    ctx.moveTo(bx, by + bh / 2 - 8);
    ctx.lineTo(bx - 12, by + bh / 2);
    ctx.lineTo(bx, by + bh / 2 + 8);
    ctx.fillStyle = "#fffbeb";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx, by + bh / 2 - 8);
    ctx.lineTo(bx - 12, by + bh / 2);
    ctx.lineTo(bx, by + bh / 2 + 8);
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 2.2;
    ctx.stroke();

    const lines = text.split("\n");
    const lineH = Math.round(fontSize * 1.68);
    const startY = by + (bh - lines.length * lineH) / 2 + lineH / 2;

    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    lines.forEach((l, i) => {
      ctx.fillText(l, bx + 18, startY + i * lineH);
    });

    ctx.restore();
  }

  // 연산 순서 밑줄 & 번호 배지 드로잉
  function drawUnderlineWithBadge(ctx, x1, x2, y, badgeNum, label, color, isActive, isDrawn) {
    if (!isDrawn) return;
    ctx.save();
    const midX = (x1 + x2) / 2;

    ctx.beginPath();
    ctx.moveTo(x1, y - 5);
    ctx.lineTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.lineTo(x2, y - 5);

    ctx.strokeStyle = color;
    ctx.lineWidth = isActive ? 3.5 : 2.2;
    if (isActive) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.moveTo(midX, y);
    ctx.lineTo(midX, y + 6);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();

    const badgeY = y + 16;
    const badgeR = 12;

    if (isActive) {
      ctx.beginPath();
      ctx.arc(midX, badgeY, badgeR + 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color + "33";
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(midX, badgeY, badgeR, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.font = "bold 13px 'Pretendard', sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(badgeNum, midX, badgeY);

    if (label) {
      ctx.font = "bold 11.5px 'Pretendard', sans-serif";
      const tagW = ctx.measureText(label).width + 10;
      const tagH = 19;
      const tagX = midX + badgeR + 4;
      const tagY = badgeY - tagH / 2;

      ctx.fillStyle = isActive ? color : "#ffffff";
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(tagX, tagY, tagW, tagH, 5);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = isActive ? "#ffffff" : color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, tagX + tagW / 2, tagY + tagH / 2);
    }

    ctx.restore();
  }

  // ==========================================
  // 문제 전환 함수

  function switchProblem(probNum) {
    currentProblem = probNum;
    if (probNum === 1) {
      currentMode = 'plan';
      planStep = 0;
      calcStep = 0;
    } else if (probNum === 2) {
      currentMode = 'calc';
      calcStep = 0;
    } else if (probNum === 3) {
      quizQuestionIdx = 0;
      quizSelectedOption = null;
      quizFeedback = null;
      quizCompleted = false;
      quizScore = 0;
    }
    playSound('step');
    updateUI();
    render();
  }

  // 모드 전환
  function toggleMode() {
    if (currentProblem === 1) {
      if (currentMode === 'plan') {
        currentMode = 'calc';
        calcStep = 0;
      } else {
        currentMode = 'plan';
        planStep = 5;
      }
      playSound('step');
      updateUI();
      render();
    }
  }

  // 다음 버튼
  function goNext() {
    if (currentProblem === 1) {
      if (currentMode === 'plan') {
        if (planStep < 5) {
          planStep++;
          playSound('step');
        } else {
          currentMode = 'calc';
          calcStep = 0;
          playSound('step');
        }
      } else {
        if (calcStep < 5) {
          calcStep++;
          playSound('step');
          if (calcStep === 5) playSound('fanfare');
        } else {
          // 예제 1 끝나면 예제 2로 넘어가기!
          switchProblem(2);
        }
      }
    } else if (currentProblem === 2) {
      // 예제 2
      if (calcStep < 5) {
        calcStep++;
        playSound('step');
        if (calcStep === 5) playSound('fanfare');
      } else {
        // 예제 2 끝나면 퀴즈로 넘어가기!
        switchProblem(3);
      }
    } else if (currentProblem === 3) {
      // 퀴즈 모드
      if (!quizCompleted) {
        if (quizFeedback && quizFeedback.isCorrect) {
          if (quizQuestionIdx < quizData.length - 1) {
            quizQuestionIdx++;
            quizSelectedOption = null;
            quizFeedback = null;
            playSound('step');
          } else {
            quizCompleted = true;
            playSound('fanfare');
          }
        }
      } else {
        // 퀴즈 끝나면 예제 1로 복귀
        switchProblem(1);
      }
    }
    updateUI();
    render();
  }

  // 이전 버튼
  function goPrev() {
    if (currentProblem === 1) {
      if (currentMode === 'plan') {
        if (planStep > 0) {
          planStep--;
          playSound('step');
        }
      } else {
        if (calcStep > 0) {
          calcStep--;
          playSound('step');
        } else {
          currentMode = 'plan';
          planStep = 5;
          playSound('click');
        }
      }
    } else if (currentProblem === 2) {
      // 예제 2
      if (calcStep > 0) {
        calcStep--;
        playSound('step');
      } else {
        currentProblem = 1;
        currentMode = 'calc';
        calcStep = 5;
        playSound('click');
      }
    } else if (currentProblem === 3) {
      // 퀴즈 모드
      if (quizCompleted) {
        quizCompleted = false;
        quizQuestionIdx = quizData.length - 1;
        playSound('click');
      } else if (quizQuestionIdx > 0) {
        quizQuestionIdx--;
        quizSelectedOption = null;
        quizFeedback = null;
        playSound('click');
      } else {
        currentProblem = 2;
        currentMode = 'calc';
        calcStep = 5;
        playSound('click');
      }
    }
    updateUI();
    render();
  }

  // ==========================================
  // 메인 렌더링 함수
  // ==========================================
  function render() {
    try {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;

      if (currentProblem === 1) {
        if (currentMode === 'plan') {
          renderPlanScreen(cx);
        } else {
          renderCalcScreen(cx);
        }
      } else if (currentProblem === 2) {
        renderCalcScreenProblem2(cx);
      } else if (currentProblem === 3) {
        renderQuizScreen(cx);
      }

    } catch (err) {
      console.error("Rendering error:", err);
    }
  }

  // ====================================================================
  // [1. 예제 1 순서 계획 화면]
  // ====================================================================
  function renderPlanScreen(cx) {
    ctx.font = "bold 20px 'Pretendard', sans-serif";
    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("📌 [예제 1] 연산 순서 파악하기", 32, 22);

    const formulaCardX = 30;
    const formulaCardY = 40;
    const formulaCardW = 900;
    const formulaCardH = 210;

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(formulaCardX, formulaCardY, formulaCardW, formulaCardH, 16);
    ctx.fill(); ctx.stroke();

    const eqY = formulaCardY + 68;
    ctx.font = "bold 28px 'Pretendard', sans-serif";

    const t4 = "-3 × (-2)";
    const w4 = 162;
    const tPlus = "  +  ";
    const wPlus = 46;
    const tBrOpen = "{ ";
    const wBrOpen = 26;
    const t1 = "(-5)²";
    const w1 = 82;
    const tMinus = "  -  ";
    const wMinus = 46;
    const t2a = "3 × ";
    const w2a = 52;
    const wFrac = 34;
    const tBrClose = " }";
    const wBrClose = 26;

    const totalEqW = w4 + wPlus + wBrOpen + w1 + wMinus + w2a + wFrac + wBrClose;
    const startEqX = cx - totalEqW / 2;

    const box4 = { x1: startEqX, x2: startEqX + w4 };
    const boxPlus = { x1: box4.x2, x2: box4.x2 + wPlus };
    const boxBrOpen = { x1: boxPlus.x2, x2: boxPlus.x2 + wBrOpen };
    const box1 = { x1: boxBrOpen.x2, x2: boxBrOpen.x2 + w1 };
    const boxMinus = { x1: box1.x2, x2: box1.x2 + wMinus };
    const box2 = { x1: boxMinus.x2, x2: boxMinus.x2 + w2a + wFrac };
    const boxBrClose = { x1: box2.x2, x2: box2.x2 + wBrClose };
    const boxBracket = { x1: boxBrOpen.x1, x2: boxBrClose.x2 };

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    drawColoredMath(ctx, t4, box4.x1, eqY, "#0f172a");
    drawColoredMath(ctx, tPlus, boxPlus.x1, eqY, "#0f172a");

    ctx.font = "bold 30px 'Pretendard', sans-serif";
    ctx.fillStyle = "#0f172a";
    ctx.fillText(tBrOpen, boxBrOpen.x1, eqY);

    ctx.font = "bold 28px 'Pretendard', sans-serif";
    drawColoredMath(ctx, t1, box1.x1, eqY, "#0f172a");
    drawColoredMath(ctx, tMinus, boxMinus.x1, eqY, "#0f172a");

    ctx.fillStyle = "#0f172a";
    ctx.fillText(t2a, box2.x1, eqY);

    const fracCenterX = box2.x1 + w2a + wFrac / 2;
    drawFraction(ctx, "3", "2", fracCenterX, eqY, 26, "#0f172a");

    ctx.font = "bold 30px 'Pretendard', sans-serif";
    ctx.fillStyle = "#0f172a";
    ctx.fillText(tBrClose, boxBrClose.x1, eqY);

    const lv1Y = eqY + 30;
    const lv2Y = eqY + 66;
    const lv3Y = eqY + 102;

    drawUnderlineWithBadge(ctx, box1.x1 - 4, box1.x2 + 4, lv1Y, "①", "거듭제곱", "#7c3aed", (planStep === 1), (planStep >= 1));
    drawUnderlineWithBadge(ctx, box2.x1 - 4, box2.x2 + 4, lv1Y, "②", "괄호 곱셈", "#ea580c", (planStep === 2), (planStep >= 2));
    drawUnderlineWithBadge(ctx, box4.x1 - 4, box4.x2 + 4, lv1Y, "④", "앞쪽 곱셈", "#16a34a", (planStep === 4), (planStep >= 4));
    drawUnderlineWithBadge(ctx, boxBracket.x1 - 4, boxBracket.x2 + 4, lv2Y, "③", "괄호 뺄셈(통분)", "#2563eb", (planStep === 3), (planStep >= 3));
    drawUnderlineWithBadge(ctx, box4.x1 - 2, boxBracket.x2 + 2, lv3Y, "⑤", "최종 덧셈", "#0891b2", (planStep === 5), (planStep >= 5));

    const botY = 262;
    const botH = 264;

    const leftRuleW = 425;
    const leftRuleX = 30;
    renderEnlargedRulesCard(leftRuleX, botY, leftRuleW, botH, planStep);

    const rightExpX = leftRuleX + leftRuleW + 16;
    const rightExpW = formulaCardW - leftRuleW - 16;
    renderPointingCharacterCard(rightExpX, botY, rightExpW, botH, planStep);
  }

  function renderEnlargedRulesCard(x, y, w, h, currentPlanStep) {

    ctx.lineWidth = 1.8;
    ctx.beginPath();

    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.roundRect(x + 12, y + 10, w - 24, 34, 8);
    ctx.fill();

    ctx.font = "bold 16px 'Pretendard', sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("⭐ 사칙연산의 4대 황금 순서", x + w / 2, y + 27);

    const ruleRows = [
      {
        num: "1",
        title: "거듭제곱 (지수) 먼저!",
        sub: "• (-5)² 처럼 지수가 붙어있는 식 최우선",

  function handleQuizOptionClick(idx) {
    if (currentProblem !== 3 || quizCompleted) return;
    const q = quizData[quizQuestionIdx];
    if (quizFeedback && quizFeedback.isCorrect) return;

    quizSelectedOption = idx;
    const opt = q.options[idx];

    if (opt.isCorrect) {
      quizFeedback = { isCorrect: true, msg: opt.desc };
      quizScore++;
      playSound('pop');
    } else {
      quizFeedback = { isCorrect: false, msg: opt.desc };
      playSound('wrong');
    }
    updateUI();
    render();
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener('click', (e) => {
    if (currentProblem === 3 && !quizCompleted) {
      const { x, y } = getCanvasPos(e);
      quizOptionHitBoxes.forEach(box => {
        if (x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h) {
          handleQuizOptionClick(box.idx);
        }
      });
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if (currentProblem === 3 && !quizCompleted) {
      const { x, y } = getCanvasPos(e);
      let isHover = false;
      quizOptionHitBoxes.forEach(box => {
        if (x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h) {
          isHover = true;
        }
      });
      canvas.style.cursor = isHover ? "pointer" : "default";
    } else {
      canvas.style.cursor = "default";
    }
  });

    ctx.fill(); ctx.stroke();

    ctx.font = "bold 24px 'Pretendard', sans-serif";
    drawColoredMath(ctx, q.formula, fBoxX + fBoxW / 2, fBoxY + fBoxH / 2, "#0f172a", "center");

    // 보기 카드 렌더링
    const optsY = 196;
    const optsH = 82;
    const n = q.options.length;

    let optWidths = [];
    let optXs = [];

    if (n === 2) {
      const wOpt = 434;
      optWidths = [wOpt, wOpt];
      optXs = [36, 490];
    } else {
      const wOpt = 286;
      optWidths = [wOpt, wOpt, wOpt];
      optXs = [36, 337, 638];
    }

    q.options.forEach((opt, idx) => {
      const ox = optXs[idx];
      const ow = optWidths[idx];
      quizOptionHitBoxes.push({ x: ox, y: optsY, w: ow, h: optsH, idx: idx });

      const isSelected = (quizSelectedOption === idx);
      const isAnswered = (quizFeedback !== null);

      let cardBg = "#ffffff";
      let cardBorder = "#cbd5e1";
      let borderWidth = 1.6;

      if (isSelected) {
        if (opt.isCorrect) {
          cardBg = "#f0fdf4";
          cardBorder = "#16a34a";
          borderWidth = 2.6;
        } else {
          cardBg = "#fef2f2";
          cardBorder = "#dc2626";
          borderWidth = 2.6;
        }
      } else if (isAnswered && opt.isCorrect && !quizFeedback.isCorrect) {
        cardBg = "#f8fafc";
        cardBorder = "#86efac";
      }

      ctx.fillStyle = cardBg;
      ctx.strokeStyle = cardBorder;
      ctx.lineWidth = borderWidth;
      ctx.beginPath();
      ctx.roundRect(ox, optsY, ow, optsH, 12);
      ctx.fill(); ctx.stroke();

      // 번호 동그라미
      const circleX = ox + 24;
      const circleY = optsY + optsH / 2;
      const circleR = 13;

      ctx.fillStyle = isSelected ? cardBorder : "#f1f5f9";
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "bold 13px 'Pretendard', sans-serif";
      ctx.fillStyle = isSelected ? "#ffffff" : "#475569";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText((idx + 1).toString(), circleX, circleY);

      // 보기 텍스트
      ctx.font = "bold 15px 'Pretendard', sans-serif";
      ctx.fillStyle = isSelected ? (opt.isCorrect ? "#15803d" : "#b91c1c") : "#1e293b";
      ctx.textAlign = "left";
      ctx.fillText(opt.text, ox + 46, circleY);

      // 정답/오답 배지
      if (isSelected) {
        ctx.font = "bold 12.5px 'Pretendard', sans-serif";
        ctx.fillStyle = opt.isCorrect ? "#16a34a" : "#dc2626";
        ctx.textAlign = "right";
        ctx.fillText(opt.isCorrect ? "⭕ 정답!" : "❌ 오답!", ox + ow - 14, circleY);
      }
    });

    // 하단 캐릭터 & 설명 말풍선
    const botY = 288;
    const botH = 240;

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(36, botY, 888, botH, 14);
    ctx.fill(); ctx.stroke();

    const charX = 86;
    const charY = botY + 115;
    drawPointingCharacter(ctx, charX, charY, false);

    const bubbleX = charX + 50;
    const bubbleY = botY + 18;
    const bubbleW = 888 - (charX + 50 - 36) - 22;
    const bubbleH = botH - 36;

    let bubbleMsg = "";
    if (!quizFeedback) {
      bubbleMsg = "어느 것이 올바른 정답일까?\n위의 보기 카드 중 하나를 직접 클릭해 봐! 💡\n\n4대 황금 순서(거듭제곱 ➔ 괄호 ➔ 곱셈 ➔ 덧셈)를 기억해!";
    } else if (quizFeedback.isCorrect) {
      bubbleMsg = `🎉 정답이야! 완벽해!\n${quizFeedback.msg}\n\n💡 꿀팁: ${q.tip}\n👉 아래 [다음 퀴즈 ▶] 버튼을 눌러줘!`;
    } else {
      bubbleMsg = `💥 아쉽다! 다시 한번 확인해 봐!\n${quizFeedback.msg}\n\n💡 꿀팁: ${q.tip}\n👉 위의 다른 보기를 다시 클릭해 봐!`;
    }

    drawComicBubble(ctx, bubbleX, bubbleY, bubbleW, bubbleH, bubbleMsg, 16);
  }

  function renderQuizCompletedScreen(cx) {
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#10b981";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.roundRect(40, 25, 880, 490, 20);
    ctx.fill(); ctx.stroke();

    ctx.font = "bold 26px 'Pretendard', sans-serif";
    ctx.fillStyle = "#059669";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🏆 축하합니다! 유리수 사칙연산 10제 퀴즈 정복 완료!", cx, 68);

    ctx.font = "15.5px 'Pretendard', sans-serif";
    ctx.fillStyle = "#64748b";
    ctx.fillText("모든 연산 순서와 함정 탈출 퀴즈를 성공적으로 끝마쳤습니다.", cx, 102);

    // 점수 결과 카드
    const scoreCardX = cx - 240;
    const scoreCardY = 130;
    const scoreCardW = 480;
    const scoreCardH = 130;

    let themeBorder = "#eab308";
    let themeBg = "#fefce8";
    let starText = "⭐⭐⭐ 퍼펙트! 연산 순서의 달인 🥇";

    if (quizScore < 10 && quizScore >= 8) {
      themeBorder = "#3b82f6";
      themeBg = "#eff6ff";
      starText = "⭐⭐ 훌륭해요! 대부분의 함정을 피했어요 🥈";
    } else if (quizScore < 8) {
      themeBorder = "#f97316";
      themeBg = "#fff7ed";
      starText = "⭐ 수고했어요! 다시 한번 도전해 봐요 🥉";
    }

    ctx.fillStyle = themeBg;
    ctx.strokeStyle = themeBorder;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.roundRect(scoreCardX, scoreCardY, scoreCardW, scoreCardH, 16);
    ctx.fill(); ctx.stroke();

    ctx.font = "bold 26px 'Pretendard', sans-serif";
    ctx.fillStyle = "#0f172a";
    ctx.fillText(`최종 결과: 10문제 중 ${quizScore}문제 정답!`, cx, scoreCardY + 45);

    ctx.font = "bold 17px 'Pretendard', sans-serif";
    ctx.fillStyle = "#1e293b";
    ctx.fillText(starText, cx, scoreCardY + 88);

    // 하단 캐릭터 + 최종 격려 말풍선
    const charX = cx - 280;
    const charY = 390;
    drawPointingCharacter(ctx, charX, charY, false);

    const bubbleX = charX + 56;
    const bubbleY = 280;
    const bubbleW = 550;
    const bubbleH = 205;
    const finalMsg = "4대 황금 순서 총정리!\n1순위: 지수가 붙은 거듭제곱 최우선!\n2순위: 소 ➔ 중 ➔ 대 괄호 순서대로!\n3순위: 곱셈과 나눗셈 먼저!\n4순위: 덧셈과 뺄셈은 통분 후 마지막!\n\n아래 [예제 1번으로 돌아가기 ↺] 버튼을 눌러 복습할 수 있어!";

    drawComicBubble(ctx, bubbleX, bubbleY, bubbleW, bubbleH, finalMsg, 15.5);
  }

  // 초기 렌더링
  updateUI();
  render();
</script>
</body>
</html>

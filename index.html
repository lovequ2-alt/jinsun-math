<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>중1 수학 개념 탐구 자료실</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f2f5;
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
    }
    .side-canvas {
      width: 150px;
      height: 300px;
    }
    .menu-card {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      padding: 34px 28px;
      border-radius: 20px;
      border: 3px solid #222;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      text-align: center;
      z-index: 2;
    }
    h1 {
      font-size: 26px;
      color: #2c3e50;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 16px;
      font-weight: 700;
      color: #34495e;
      margin-bottom: 12px;
    }
    #lineCanvas {
      display: block;
      margin: 0 auto 22px auto;
    }
    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: #f8f9fa;
      border: 2px solid #ddd;
      border-radius: 14px;
      text-decoration: none;
      color: #2c3e50;
      font-size: 17px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .lesson-btn:hover {
      background: #eef7ff;
      border-color: #3498db;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.15);
    }
    .badge {
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- 왼쪽: 주인공 캔버스 -->
  <canvas id="heroCanvas" class="side-canvas" width="150" height="300"></canvas>

  <!-- 중앙: 메뉴 카드 -->
  <div class="menu-card">
    <h1>📐 중1 수학 개념 탐구</h1>
    <p class="sub">뭐 부터 볼까?</p>

    <!-- 카드 내부 수직선 표시 -->
    <canvas id="lineCanvas" width="480" height="42"></canvas>

    <div class="btn-list">
      <a href="line.html" class="lesson-btn">
        <span>1. 수직선에서 수 알아보기</span>
        <span class="badge" style="background:#8e44ad;">수야수야</span>
      </a>

      <a href="prime.html" class="lesson-btn">
        <span>2. 소수와 합성수 탐구</span>
        <span class="badge" style="background:#27ae60;">이런수저런수</span>
      </a>

      <a href="gcd.html" class="lesson-btn">
        <span>3. 공약수와 최대공약수</span>
        <span class="badge" style="background:#e67e22;">약수약수</span>
      </a>
    </div>
  </div>

  <!-- 오른쪽: 친구 캔버스 -->
  <canvas id="friendCanvas" class="side-canvas" width="150" height="300"></canvas>
</div>

<script>
  // 메뉴 카드 내부 미니 수직선 렌더링
  function drawMiniNumberLine() {
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    const baselineY = 16;
    const startX = 25;
    const endX = 455;
    const unit = 70;
    const originX = 240; // 0의 위치

    // 중심선
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#34495e";
    ctx.beginPath();
    ctx.moveTo(startX, baselineY);
    ctx.lineTo(endX, baselineY);
    ctx.stroke();

    // 양쪽 화살표
    ctx.fillStyle = "#34495e";
    ctx.beginPath();
    ctx.moveTo(endX, baselineY); ctx.lineTo(endX - 8, baselineY - 4); ctx.lineTo(endX - 8, baselineY + 4); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(startX, baselineY); ctx.lineTo(startX + 8, baselineY - 4); ctx.lineTo(startX + 8, baselineY + 4); ctx.fill();

    // 눈금 및 라벨 (-3 ~ 3)
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    for (let n = -3; n <= 3; n++) {
      const x = originX + n * unit;
      const isZero = (n === 0);

      ctx.lineWidth = isZero ? 2.5 : 1.5;
      ctx.strokeStyle = isZero ? "#e74c3c" : "#7f8c8d";
      ctx.beginPath();
      ctx.moveTo(x, baselineY - (isZero ? 7 : 4));
      ctx.lineTo(x, baselineY + (isZero ? 7 : 4));
      ctx.stroke();

      ctx.fillStyle = isZero ? "#e74c3c" : "#555";
      ctx.fillText(n, x, baselineY + 18);
    }
  }

  // 양쪽 캐릭터 그리기
  function drawChar(ctx, x, y, isFriend = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#111";
    ctx.fillStyle = "#fff";
    
    // 머리
    ctx.beginPath();
    ctx.arc(0, -50, 18, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // 친구 모자
    if (isFriend) {
      ctx.fillStyle = "#3498db";
      ctx.beginPath();
      ctx.arc(0, -64, 15, Math.PI, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }

    // 눈
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(-5, -52, 2.5, 0, Math.PI * 2);
    ctx.arc(5, -52, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 몸통 & 팔다리
    ctx.beginPath();
    ctx.moveTo(0, -32); ctx.lineTo(0, -6); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -22); ctx.lineTo(-14, -12);
    ctx.moveTo(0, -22); ctx.lineTo(14, -12);
    ctx.moveTo(0, -6); ctx.lineTo(-9, 8);
    ctx.moveTo(0, -6); ctx.lineTo(9, 8);
    ctx.stroke();
    ctx.restore();
  }

  // 말풍선 그리기
  function drawBubble(ctx, x, y, text, isFriend = false) {
    ctx.save();
    ctx.font = "bold 13px 'Pretendard', sans-serif";
    const textW = ctx.measureText(text).width;
    const boxW = textW + 20;
    const boxH = 34;

    ctx.fillStyle = isFriend ? "#e8f4fd" : "#fff";
    ctx.strokeStyle = isFriend ? "#2980b9" : "#222";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x - boxW / 2, y, boxW, boxH, 8);
    ctx.fill(); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - 5, y + boxH);
    ctx.lineTo(x, y + boxH + 6);
    ctx.lineTo(x + 5, y + boxH);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#111";
    ctx.textAlign = "center";
    ctx.fillText(text, x, y + 21);
    ctx.restore();
  }

  // 실행
  drawMiniNumberLine();

  const heroCanvas = document.getElementById('heroCanvas');
  const hCtx = heroCanvas.getContext('2d');
  drawChar(hCtx, 75, 235, false);
  drawBubble(hCtx, 75, 125, "수학 놀자!", false);

  const friendCanvas = document.getElementById('friendCanvas');
  const fCtx = friendCanvas.getContext('2d');
  drawChar(fCtx, 75, 235, true);
  drawBubble(fCtx, 75, 125, "골라봐!", true);
</script>

</body>
</html>

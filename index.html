<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중학 수학 탐험실 - 목차</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .menu-container {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .menu-title {
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 24px;
      text-align: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 14px;
    }

    /* 대분류 메뉴 그룹 */
    .category-group {
      margin-bottom: 30px;
    }

    /* 대메뉴 타이틀 */
    .category-title {
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-left: 6px;
    }

    /* 서브메뉴 리스트 */
    .submenu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 12px;
    }

    /* 링크 카드 */
    .menu-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 14px 18px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 15.5px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .menu-link:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
    }

    .menu-badge {
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .menu-arrow {
      color: #64748b;
      font-weight: bold;
      transition: color 0.2s;
    }

    .menu-link:hover .menu-arrow {
      color: #38bdf8;
    }
  </style>
</head>
<body>

<div class="menu-container">
  <div class="menu-title">📐 중·초등 수학 개념 탐구실</div>

  <!-- 대메뉴: 헷갈리는 중1수학 -->
  <div class="category-group">
    <div class="category-title">
      <span>📌</span> 헷갈리는 중1수학
    </div>
    
    <ul class="submenu-list">
      <li>
        <a href="line.html" class="menu-link">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="menu-badge" style="background: #8b5cf6;">정수/유리수</span>
            <span>1. 수직선과 수의 체계</span>
          </div>
          <span class="menu-arrow">시작하기 ▶</span>
        </a>
      </li>
      <li>
        <a href="prime.html" class="menu-link">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="menu-badge" style="background: #10b981;">소수/합성수</span>
            <span>2. 소수와 합성수 탐구</span>
          </div>
          <span class="menu-arrow">시작하기 ▶</span>
        </a>
      </li>
      <li>
        <a href="gcd.html" class="menu-link">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="menu-badge" style="background: #f97316;">약수와 배수</span>
            <span>3. 공약수와 최대공약수</span>
          </div>
          <span class="menu-arrow">시작하기 ▶</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- 대메뉴: 헷갈리는 초등수학 -->
  <div class="category-group" style="margin-bottom: 0;">
    <div class="category-title">
      <span>🍎</span> 헷갈리는 초등수학
    </div>
    
    <ul class="submenu-list">
      <li>
        <a href="분수.html" class="menu-link">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="menu-badge" style="background: #3b82f6;">분수와 나눗셈</span>
            <span>1. 헷갈리는 나눗셈 식 세우기</span>
          </div>
          <span class="menu-arrow">시작하기 ▶</span>
        </a>
      </li>
      <li>
        <a href="분수나누기곱하기.html" class="menu-link">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="menu-badge" style="background: #2563eb;">곱하기 vs 나누기</span>
            <span>2. 헷갈리는 분수셈</span>
          </div>
          <span class="menu-arrow">시작하기 ▶</span>
        </a>
      </li>
    </ul>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중·초등 수학 개념 탐구실</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }

    #scale-wrapper {
      position: absolute;
      width: 960px; height: 580px;
      transform-origin: center center;
    }

    #index-container {
      position: relative;
      width: 960px; height: 580px;
      display: flex; align-items: center; justify-content: center;
    }

    /* 메인 보드 카드 */
    .menu-card {
      width: 720px;
      background: #ffffff;
      border: 3px solid #334155;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
      padding: 24px 32px 28px;
      display: flex; flex-direction: column; align-items: center;
      z-index: 10;
    }

    .main-title {
      font-size: 23px; font-weight: 900; color: #0f172a;
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    .sub-title {
      font-size: 13.5px; font-weight: 700; color: #64748b; margin-bottom: 12px;
    }

    /* 수직선 그래픽 */
    .number-line-wrap {
      width: 480px; height: 32px; position: relative; margin-bottom: 14px;
    }
    .number-line-axis {
      position: absolute; top: 12px; left: 10px; right: 10px; height: 2.5px; background: #475569;
    }
    .axis-arrow-l {
      position: absolute; top: 8.5px; left: 3px; width: 0; height: 0;
      border-right: 8px solid #475569; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    }
    .axis-arrow-r {
      position: absolute; top: 8.5px; right: 3px; width: 0; height: 0;
      border-left: 8px solid #475569; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    }
    .tick-container {
      position: absolute; top: 0; left: 24px; right: 24px; height: 100%;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tick-item {
      display: flex; flex-direction: column; align-items: center; width: 20px;
    }
    .tick-mark { width: 2px; height: 9px; background: #64748b; }
    .tick-item.zero .tick-mark { height: 13px; background: #dc2626; width: 2.5px; }
    .tick-val { font-size: 11px; font-weight: 800; color: #64748b; margin-top: 3px; }
    .tick-item.zero .tick-val { color: #dc2626; }

    /* 2열 메뉴 */
    .menu-columns {
      width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    }

    .col-header {
      background: #f1f5f9; border: 1.5px solid #cbd5e1; border-radius: 12px;
      padding: 9px; text-align: center; font-size: 14.5px; font-weight: 800; color: #0f172a;
      display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px;
    }

    .menu-item-list { display: flex; flex-direction: column; gap: 8px; }

    /* 메뉴 버튼 */
    .menu-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px;
      text-decoration: none; color: #1e293b; font-size: 13.5px; font-weight: 800;
      transition: all 0.18s ease;
    }
    .menu-btn:hover {
      border-color: #2563eb; background: #f8fafc; transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .menu-btn.active-blue {
      border-color: #2563eb; color: #1d4ed8;
    }

    /* 뱃지 */
    .badge {
      font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 8px; color: #ffffff;
      white-space: nowrap;
    }
    .badge-purple { background: #7c3aed; }
    .badge-green { background: #059669; }
    .badge-orange { background: #ea580c; }
    .badge-blue { background: #2563eb; }

    /* 준비 중 버튼 */
    .menu-btn.disabled {
      background: #ffffff; border: 1.5px dashed #cbd5e1; color: #94a3b8;
      cursor: not-allowed; pointer-events: none;
    }
    .badge-gray { background: #94a3b8; color: #ffffff; }

    /* 좌우 캐릭터 */
    .char-box {
      position: absolute; bottom: 80px; display: flex; flex-direction: column; align-items: center;
    }
    .char-left { left: 16px; }
    .char-right { right: 16px; }

    .speech-bubble {
      background: #ffffff; border: 2px solid #334155; border-radius: 12px;
      padding: 7px 12px; font-size: 13px; font-weight: 800; color: #0f172a;
      position: relative; margin-bottom: 12px; white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }
    .speech-bubble::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-top: 8px solid #ffffff;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
    }
    .speech-bubble::before {
      content: ''; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-top: 10px solid #334155;
      border-left: 7px solid transparent; border-right: 7px solid transparent;
    }
    .char-svg { width: 52px; height: 90px; }
  </style>
</head>
<body>

<div id="scale-wrapper">
  <div id="index-container">

    <!-- 왼쪽 캐릭터: 수학 놀자! -->
    <div class="char-box char-left">
      <div class="speech-bubble">수학 놀자!</div>
      <svg class="char-svg" viewBox="0 0 50 85">
        <circle cx="25" cy="18" r="14" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
        <circle cx="21" cy="16" r="2.2" fill="#111"/>
        <circle cx="29" cy="16" r="2.2" fill="#111"/>
        <path d="M 25 32 L 25 58" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 40 L 12 50" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 40 L 38 50" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 58 L 16 80" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 58 L 34 80" stroke="#111" stroke-width="2.5"/>
      </svg>
    </div>

    <!-- 중앙 메인 보드 -->
    <div class="menu-card">
      <div class="main-title">📐 중·초등 수학 개념 탐구실</div>
      <div class="sub-title">어떤 이야기부터 알아볼까?</div>

      <!-- 수직선 -->
      <div class="number-line-wrap">
        <div class="axis-arrow-l"></div>
        <div class="number-line-axis"></div>
        <div class="axis-arrow-r"></div>
        <div class="tick-container">
          <div class="tick-item"><div class="tick-mark"></div><div class="tick-val">-3</div></div>
          <div class="tick-item"><div class="tick-mark"></div><div class="tick-val">-2</div></div>
          <div class="tick-item"><div class="tick-mark"></div><div class="tick-val">-1</div></div>
          <div class="tick-item zero"><div class="tick-mark"></div><div class="tick-val">0</div></div>
          <div class="tick-item"><div class="tick-mark"></div><div class="tick-val">1</div></div>
          <div class="tick-item"><div class="tick-mark"></div><div class="tick-val">2</div></div>
          <div class="tick-item"><div class="tick-mark"></div><div class="tick-val">3</div></div>
        </div>
      </div>

      <!-- 2열 리스트 -->
      <div class="menu-columns">

        <!-- 왼쪽 열: 헷갈리는 중1수학 -->
        <div>
          <div class="col-header">📌 헷갈리는 중1수학</div>
          <div class="menu-item-list">
            <a href="#" class="menu-btn">
              <span>1. 수직선과 수의 체계</span>
              <span class="badge badge-purple">정수/유리수</span>
            </a>
            <a href="#" class="menu-btn">
              <span>2. 소수와 합성수 탐구</span>
              <span class="badge badge-green">소수/합성수</span>
            </a>
            <a href="#" class="menu-btn">
              <span>3. 공약수와 최대공약수</span>
              <span class="badge badge-orange">약수와 배수</span>
            </a>
            <div class="menu-btn disabled">
              <span>4. 다음 주제 준비 중...</span>
              <span class="badge badge-gray">UPDATING</span>
            </div>
          </div>
        </div>

        <!-- 오른쪽 열: 헷갈리는 초등수학 -->
        <div>
          <div class="col-header">🍎 헷갈리는 초등수학</div>
          <div class="menu-item-list">
            <a href="#" class="menu-btn active-blue">
              <span>1. 헷갈리는 나눗셈 식 세우기</span>
              <span class="badge badge-blue">분수와 나눗셈</span>
            </a>

            <!-- ★ 오른쪽 2번에 연결된 '헷갈리는 분수셈' 버튼 ★ -->
            <a href="분수나누기곱하기.html" class="menu-btn active-blue">
              <span>2. 헷갈리는 분수셈</span>
              <span class="badge badge-blue">곱하기 vs 나누기</span>
            </a>

            <div class="menu-btn disabled">
              <span>3. 준비 중...</span>
              <span class="badge badge-gray">UPDATING</span>
            </div>
            <div class="menu-btn disabled">
              <span>4. 준비 중...</span>
              <span class="badge badge-gray">UPDATING</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 오른쪽 캐릭터: 하나 골라봐! -->
    <div class="char-box char-right">
      <div class="speech-bubble">하나 골라봐!</div>
      <svg class="char-svg" viewBox="0 0 50 85">
        <circle cx="25" cy="18" r="14" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
        <path d="M 12 14 Q 25 2 38 14 Z" fill="#3b82f6" stroke="#111" stroke-width="2"/>
        <circle cx="21" cy="19" r="2.2" fill="#111"/>
        <circle cx="29" cy="19" r="2.2" fill="#111"/>
        <path d="M 25 32 L 25 58" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 40 L 12 50" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 40 L 38 50" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 58 L 16 80" stroke="#111" stroke-width="2.5"/>
        <path d="M 25 58 L 34 80" stroke="#111" stroke-width="2.5"/>
      </svg>
    </div>

  </div>
</div>

<script>
  function resizeIndex() {
    const wrapper = document.getElementById('scale-wrapper');
    const availableW = window.innerWidth * 0.95;
    const availableH = window.innerHeight * 0.93;
    const scale = Math.min(availableW / 960, availableH / 580);
    wrapper.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', resizeIndex);
  window.addEventListener('orientationchange', () => setTimeout(resizeIndex, 150));
  resizeIndex();
</script>
</body>
</html>

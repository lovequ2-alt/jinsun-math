<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학 - 약수와 공약수 (모바일 강제 맞춤 완벽판)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f2f5;
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 800px;  /* 가로 기준 크기 */
      height: 420px; /* 세로 기준 크기를 대폭 낮춰 모바일 잘림 원천 방지 */
      background: #ffffff;
      border: 3px solid #222;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      overflow: hidden;
      transform-origin: center center;
    }
    canvas { 
      position: absolute;
      top: 0; left: 0;
      display: block; width: 100%; height: 100%; 
      z-index: 1;
    }
    #ui-panel {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      background: rgba(255, 255, 255, 0.96);
      padding: 6px 16px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      border: 1.5px solid #e2e8f0;
      max-width: 95%;
      z-index: 9999; 
    }
    .btn-row { display: flex; gap: 6px; align-items: center; }
    .nav-btn {
      background: #1e293b; color: #fff; border: none;
      padding: 6px 14px; font-size: 13px; font-weight: bold;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .nav-btn:hover { background: #334155; }
    .nav-btn:active { transform: scale(0.96); }
    #status-text { font-size: 13px; color: #1e293b; font-weight: 800; text-align: center; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="800" height="420"></canvas>
  <div id="ui-panel">
    <span id="status-text">1단계: 막대기 9 소개</span>
    <div class="btn-row" id="normal-controls">
      <button id="prev-btn" class="nav-btn" onclick="goPrev()" style="display:none;">◀ 이전</button>
      <button id="next-btn" class="nav-btn" onclick="goNext()">다음 ▶</button>
    </div>
    <div class="btn-row" id="result-controls" style="display:none;">
      <button class="nav-btn" onclick="loadScene(0)">🏠 처음으로</button>
      <button class="nav-btn" onclick="loadScene(8)">◀ 설명 화면</button>
      <button class="nav-btn" style="background:#8e44ad;" onclick="loadScene(9)">🔄 다시하기</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const statusText = document.getElementById('status-text');
  const normalControls = document.getElementById('normal-controls');
  const resultControls = document.getElementById('result-controls');

  let scene = 0;
  let replyTimer = null;

  let speechBubble1 = { text: "" };
  let speechBubble2 = { text: "" };
  let cancelProgress = 0;

  let mouseX = 0;
  let mouseY = 0;

  const gameData = [
    { pair: "12와 18", num: "6", type: "gcd", exp: "12와 18을 나눌 수 있는 가장 큰 수니까 [최대공약수]!" },
    { pair: "12와 18", num: "2", type: "cd", exp: "공약수지만 제일 큰 6은 아니므로 [최대공약수 아닌 공약수]!" },
    { pair: "8과 20", num: "4", type: "gcd", exp: "8과 20을 둘 다 가장 크게 자를 수 있으므로 [최대공약수]!" },
    { pair: "8과 20", num: "2", type: "cd", exp: "최대공약수 4보다 작은 공약수니까 [최대공약수 아닌 공약수]!" },
    { pair: "15와 30", num: "15", type: "gcd", exp: "15 자체가 30을 나누므로 둘의 가장 큰 공약수는 [최대공약수 15]!" },
    { pair: "15와 30", num: "5", type: "cd", exp: "15의 약수 중 하나지만 최대는 아니니 [최대공약수 아닌 공약수]!" },
    { pair: "9와 24", num: "3", type: "gcd", exp: "9와 24를 나눌 수 있는 제일 큰 수! 바로 [최대공약수]!" },
    { pair: "9와 24", num: "1", type: "cd", exp: "1은 공약수이지만 최대인 3이 아니니 [최대공약수 아닌 공약수]!" },
    { pair: "16과 24", num: "8", type: "gcd", exp: "16과 24를 가장 크게 나누는 수는 [최대공약수 8]!" },
    { pair: "16과 24", num: "4", type: "cd", exp: "8보다 작은 공약수니까 [최대공약수 아닌 공약수]!" },
    { pair: "18과 24", num: "6", type: "gcd", exp: "함정 조심! 둘을 동시에 나누는 수 중 가장 큰 [최대공약수]는 6!" },
    { pair: "14와 28", num: "14", type: "gcd", exp: "28이 14의 배수이므로 작은 수인 14 자체가 [최대공약수]!" },
    { pair: "8과 9", num: "1", type: "gcd", exp: "공약수가 1밖에 없는 서로소 관계! 따라서 1이 곧 [최대공약수]!" },
    { pair: "18과 36", num: "9", type: "cd", exp: "9로도 나누어지지만 더 큰 18이 최대공약수! 9는 [최대공약수 아닌 공약수]!" },
    { pair: "20과 30", num: "5", type: "cd", exp: "둘의 최대공약수는 10이야! 따라서 5는 [최대공약수 아닌 공약수]!" }
  ];

  let gameIndex = 0;
  let gameScore = 0;
  let gameStatus = 'falling';
  let fallingX = 400;
  let fallingY = -25;
  let fallingScale = 1.0;
  let targetBasketX = 400;
  let targetBasketY = 240;
  let gameSelectedType = "";
  let gameResultMark = "";
  let gameResultExp = "";

  function drawRoundedRect(x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function drawDoodleChar(x, y, scale = 1, isFriend = false, eyeType = 'normal') {
    ctx.save(); 
    ctx.translate(x, y); 
    ctx.scale(scale, scale);
    ctx.lineWidth = 3 / scale; 
    ctx.strokeStyle = "#111"; 
    ctx.fillStyle = "#fff";
    
    ctx.beginPath(); ctx.arc(0, -40, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    
    if (isFriend) { 
      ctx.fillStyle = "#3498db"; 
      ctx.beginPath(); ctx.arc(0, -50, 12, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    }
    
    ctx.fillStyle = "#111";
    if (eyeType === 'sigh' || eyeType === 'dizzy') { 
      ctx.fillRect(-8, -42, 4, 2); ctx.fillRect(3, -42, 4, 2); 
    } else if (eyeType === 'doubt') {
      ctx.beginPath(); ctx.arc(-3, -42, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(2, -43, 5, 2);
    } else { 
      ctx.beginPath(); ctx.arc(-3, -42, 1.8, 0, Math.PI * 2); ctx.arc(3, -42, 1.8, 0, Math.PI * 2); ctx.fill(); 
    }
    
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(0, -8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-9, -10); ctx.moveTo(0, -20); ctx.lineTo(9, -10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(-6, 0); ctx.moveTo(0, -8); ctx.lineTo(6, 0); ctx.stroke();
    ctx.restore();
  }

  function drawBubble(x, y, text, isFriend = false, offsetX = 0, offsetY = 0) {
    if (!text) return;
    ctx.save();
    ctx.font = "bold 12px 'Pretendard', sans-serif";
    const lines = text.split('\n');
    let maxW = 0;
    lines.forEach(l => { maxW = Math.max(maxW, ctx.measureText(l).width); });
    
    const boxW = Math.max(maxW + 20, 100);
    const boxH = Math.max(lines.length * 16 + 10, 30);

    const drawX = x + offsetX;
    const targetY = (isFriend ? y - 105 : y - 90) + offsetY - (lines.length > 1 ? 10 : 0);
    
    ctx.fillStyle = isFriend ? "#e8f4fd" : "rgba(255, 255, 255, 0.98)";
    ctx.strokeStyle = isFriend ? "#2980b9" : "#222";
    ctx.lineWidth = 2;

    drawRoundedRect(drawX - boxW / 2, targetY, boxW, boxH, 6);
    ctx.fill(); ctx.stroke();

    ctx.beginPath();
    const tailBaseX = drawX - offsetX * 0.4;
    ctx.moveTo(tailBaseX - 4, targetY + boxH);
    ctx.lineTo(x, targetY + boxH + 6);
    ctx.lineTo(tailBaseX + 4, targetY + boxH);
    ctx.fillStyle = isFriend ? "#e8f4fd" : "#fff";
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#111";
    ctx.textAlign = "center";
    lines.forEach((l, idx) => {
      ctx.fillText(l, drawX, targetY + 16 + (idx * 15));
    });
    ctx.restore();
  }

  const U = 34;
  function drawBar(x, y, length, label, color = "#f1c40f", alpha = 1.0) {
    const width = length * U;
    const height = 36;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 2.5;

    drawRoundedRect(x, y, width, height, 6);
    ctx.fill(); ctx.stroke();
    
    ctx.fillStyle = "#111";
    ctx.font = "bold 13px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + width / 2, y + height / 2);
    ctx.restore();
    return width;
  }

  function drawBigFraction(x, y, num, den, numColor = "#111", denColor = "#111") {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 30px 'Pretendard', sans-serif";
    
    ctx.fillStyle = numColor;
    ctx.fillText(num, x, y - 22);

    ctx.strokeStyle = "#222"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 22, y); ctx.lineTo(x + 22, y); ctx.stroke();

    ctx.fillStyle = denColor;
    ctx.fillText(den, x, y + 22);
    ctx.restore();
  }

  function drawBasket(x, y, labelTop, labelBottom, color, isHover = false) {
    ctx.save();
    if(isHover) { ctx.translate(x, y); ctx.scale(1.04, 1.04); ctx.translate(-x, -y); }
    
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - 65, y - 15); ctx.lineTo(x + 65, y - 15);
    ctx.lineTo(x + 48, y + 36); ctx.lineTo(x - 48, y + 36);
    ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#222"; ctx.stroke();
    
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    ctx.beginPath(); ctx.ellipse(x, y - 15, 65, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#111"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
    if (labelBottom) {
      ctx.fillText(labelTop, x, y + 54);
      ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#475569";
      ctx.fillText(labelBottom, x, y + 68);
    } else {
      ctx.fillText(labelTop, x, y + 58);
    }
    ctx.restore();
  }

  function drawFallingBubble(x, y, num, scale = 1) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1e293b"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(num, 0, 0);
    ctx.restore();
  }

  function setDialogue(speaker1, text1, speaker2, text2, delay = 850) {
    if (replyTimer) clearTimeout(replyTimer);
    speechBubble1.text = ""; speechBubble2.text = "";
    if (speaker1 === 'char') speechBubble1.text = text1; 
    else if (speaker1 === 'friend') speechBubble2.text = text1;

    if (text2 && speaker2) {
      replyTimer = setTimeout(() => {
        if (speaker2 === 'char') speechBubble1.text = text2; 
        else if (speaker2 === 'friend') speechBubble2.text = text2;
      }, delay);
    }
  }

  function loadScene(newScene) {
    scene = newScene;
    if (replyTimer) clearTimeout(replyTimer);
    cancelProgress = 0;

    prevBtn.style.display = (scene > 0 && scene <= 8) ? "inline-block" : "none";
    
    if (scene <= 8) {
      normalControls.style.display = "flex";
      resultControls.style.display = "none";
      nextBtn.innerText = (scene === 8) ? "게임 시작하기 ▶" : "다음 ▶";
    } else if (scene === 9) {
      normalControls.style.display = "none";
      resultControls.style.display = "none";
      statusText.innerText = `🎮 문제 ${gameIndex + 1} / 15 : 알맞은 바구니를 클릭하세요!`;
      gameIndex = 0; gameScore = 0; gameStatus = 'falling';
      fallingX = 400; fallingY = -25; fallingScale = 1.0;
      gameResultMark = ""; gameResultExp = "";
    } else if (scene === 10) {
      normalControls.style.display = "none";
      resultControls.style.display = "flex";
      statusText.innerText = "🎉 15문제 완료! 복습 결과를 확인하세요.";
      setDialogue('char', `15문제 중 ${gameScore}문제를 맞췄어!`, 
                  'friend', gameScore >= 12 ? "대단해! 함정 문제까지 완벽하게 간파했네!" : "수고했어! 헷갈렸던 문제만 조금 더 복습해보자!", 800);
    }

    switch(scene) {
      case 0:
        statusText.innerText = "1단계: 막대기 9 소개";
        setDialogue('char', "짜잔~ 하하 내가 막대기 9를 줏어왔어", 'friend', "9라 ~ 흠 1, 3, 9를 약수로 가진 친구군", 800);
        break;
      case 1:
        statusText.innerText = "2단계: 막대기 6 소개";
        setDialogue('char', "이번엔 막대기 6을 보여줄게", 'friend', "6은 9보다 작지만 약수가 4개야!", 800);
        break;
      case 2:
        statusText.innerText = "3단계: 공통 약수 3 발견";
        setDialogue('char', "약수 중 3이 공통이네?", 'friend', "그래 둘이 똑같이 3으로 나눌 수 있어!", 800);
        break;
      case 3:
        statusText.innerText = "4단계: 2로는 못 나누나?";
        setDialogue('char', "그럼 2로는 못 나누나?", 'friend', "맞아 2는 9를 나누면 나머지가 남지!", 800);
        break;
      case 4:
        statusText.innerText = "5단계: 공약수 3으로 비교하기";
        setDialogue('char', "공통으로 나눌 수 있는 수는 뭐라고 해?", 'friend', "바로 '공약수'라고 부르지!", 800);
        break;
      case 5:
        statusText.innerText = "6단계: 분수 약분할 때 쓴다!";
        setDialogue('char', "이걸 어디다 쓰냐고?", 'friend', "분수 약분할 때 싹 지워지지!", 800);
        break;
      case 6:
        statusText.innerText = "7단계: 6과 12의 공약수와 최대공약수";
        setDialogue('char', "6과 12의 공약수는?", 'friend', "제일 큰 수 6이 최대공약수야.", 800);
        break;
      case 7:
        statusText.innerText = "8단계: 최대공약수와 약수의 관계";
        setDialogue('char', "최대공약수 6으로 자를 수 있네", 'friend', "그래! 공약수로 다 잘라지지", 850);
        break;
      case 8:
        statusText.innerText = "9단계: 알쏭달쏭한 정리";
        setDialogue('char', "공약수 구하기 쉽네!", 'friend', "최대공약수를 먼저 구하면 되지!", 850);
        break;
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#f1f5f9"; ctx.lineWidth = 1.5;
    for (let y = 40; y <= 230; y += 32) {
      ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(770, y); ctx.stroke();
    }

    const startX = 50;

    if (scene <= 8) {
      if (scene === 0) {
        drawBar(startX, 60, 9, "막대기 9  (약수: 1, 3, 9)", "#f1c40f");
      } 
      else if (scene === 1) {
        drawBar(startX, 42, 9, "막대기 9  (약수: 1, 3, 9)", "#f1c40f");
        drawBar(startX, 90, 6, "막대기 6  (약수: 1, 2, 3, 6)", "#38bdf8");
      }
      else if (scene === 2) {
        let total9W = 3 * (3 * U + 5);
        drawBar(startX, 42, 3, "3씩", "#2ecc71");
        drawBar(startX + 3*U + 5, 42, 3, "3씩", "#2ecc71");
        drawBar(startX + 6*U + 10, 42, 3, "3씩", "#2ecc71");
        
        ctx.fillStyle = "#1e293b"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("= 9 (3도막)", startX + total9W + 12, 62);

        let total6W = 2 * (3 * U + 5);
        drawBar(startX, 90, 3, "3씩", "#9b59b6");
        drawBar(startX + 3*U + 5, 90, 3, "3씩", "#9b59b6");
        ctx.fillText("= 6 (2도막)", startX + total6W + 12, 110);
      }
      else if (scene === 3) {
        let curX = startX;
        for (let i = 0; i < 4; i++) {
          drawBar(curX, 42, 2, "2씩", "#f1c40f");
          curX += 2 * U + 5;
        }
        drawBar(curX, 42, 1, "남음 1", "#e74c3c");
        ctx.fillStyle = "#c0392b"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("≠ 9 (나머지 1)", curX + 1*U + 10, 62);

        curX = startX;
        for (let i = 0; i < 3; i++) {
          drawBar(curX, 90, 2, "2씩", "#38bdf8");
          curX += 2 * U + 5;
        }
        ctx.fillStyle = "#27ae60"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("= 6 (나누어떨어짐)", curX + 10, 110);
      }
      else if (scene === 4) {
        const leftX = 50; const rightX = 420;
        ctx.fillStyle = "#d97706"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("막대기 9 (3으로 3도막)", leftX, 40);
        drawBar(leftX, 48, 3, "3", "#2ecc71");
        drawBar(leftX + 3*U + 5, 48, 3, "3", "#2ecc71");
        drawBar(leftX + 6*U + 10, 48, 3, "3", "#2ecc71");

        ctx.fillStyle = "#0284c7"; ctx.font = "bold 13px sans-serif";
        ctx.fillText("막대기 6 (3으로 2도막)", rightX, 40);
        drawBar(rightX, 48, 3, "3", "#2ecc71");
        drawBar(rightX + 3*U + 5, 48, 3, "3", "#2ecc71");

        ctx.fillStyle = "#047857"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("✨ 공통으로 잘라낼 수 있는 크기 = '3' (공약수) ✨", 400, 120);
      }
      else if (scene === 5) {
        if (cancelProgress < 1) cancelProgress += 0.015;
        const fracX = 95; const barStartX = 200;
        const barY_num = 40; const barY_den = 100;

        drawBigFraction(fracX, 72, "2", "4", "#0284c7", "#7c3aed");
        ctx.fillStyle = "#333"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("=", 150, 74);

        const alphaVal = Math.max(1 - cancelProgress * 1.3, 0);
        drawBar(barStartX, barY_num, 2, "2", "#38bdf8", alphaVal);
        drawBar(barStartX, barY_den, 2, "2", "#c084fc", alphaVal);
        drawBar(barStartX + 2*U + 5, barY_den, 2, "2", "#c084fc", 1.0);

        if (cancelProgress > 0.1) {
          ctx.save(); ctx.strokeStyle = "#e11d48"; ctx.lineWidth = 2.5;
          const lineLen = Math.min(cancelProgress * 1.5, 1);
          ctx.beginPath(); ctx.moveTo(barStartX - 3, barY_num + 32); ctx.lineTo(barStartX - 3 + (2*U + 10) * lineLen, barY_num + 32 - 36 * lineLen); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(barStartX - 3, barY_den + 32); ctx.lineTo(barStartX - 3 + (2*U + 10) * lineLen, barY_den + 32 - 36 * lineLen); ctx.stroke();
          ctx.restore();
        }

        if (cancelProgress > 0.4) {
          ctx.save(); ctx.fillStyle = "#e11d48"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
          ctx.globalAlpha = Math.min((cancelProgress - 0.4) * 2, 1);
          ctx.fillText("1", barStartX + U, barY_num + 18);
          ctx.fillText("1", barStartX + U, barY_den + 18);
          ctx.restore();
        }

        if (cancelProgress > 0.6) {
          ctx.save(); ctx.globalAlpha = Math.min((cancelProgress - 0.6) * 2.5, 1);
          ctx.fillStyle = "#333"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
          ctx.fillText("➔", 460, 74);
          drawBigFraction(530, 72, "1", "2", "#e11d48", "#7c3aed");
          ctx.fillStyle = "#047857"; ctx.font = "bold 13px sans-serif";
          ctx.fillText("공약수 2로 약분!", 530, 120);
          ctx.restore();
        }
      }
      else if (scene === 6) {
        drawBar(startX, 42, 6, "6의 약수: [1, 2, 3, 6]", "#38bdf8");
        drawBar(startX, 90, 12, "12의 약수: [1, 2, 3, 4, 6, 12]", "#fb923c");
        ctx.fillStyle = "#8e44ad"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("공통 약수 = 1, 2, 3, 6   ➔   제일 큰 수 '6'이 최대공약수!", startX, 142);
      }
      else if (scene === 7) {
        ctx.fillStyle = "#0f172a"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("🔍 12와 18의 최대공약수(6)로 두 수 자르기", startX, 32);

        ctx.fillStyle = "#0284c7"; ctx.font = "bold 12px sans-serif";
        ctx.fillText("막대기 12", startX, 50);
        drawBar(startX, 58, 6, "6", "#06b6d4");
        drawBar(startX + 6*U + 5, 58, 6, "6", "#06b6d4");

        ctx.fillStyle = "#7c3aed"; ctx.font = "bold 12px sans-serif";
        ctx.fillText("막대기 18", startX, 105);
        drawBar(startX, 113, 6, "6", "#a855f7");
        drawBar(startX + 6*U + 5, 113, 6, "6", "#a855f7");
        drawBar(startX + 12*U + 10, 113, 6, "6", "#a855f7");
      }
      else if (scene === 8) {
        ctx.fillStyle = "#0f172a"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("💡 최대공약수 6의 약수 [1, 2, 3, 6]이 곧 모든 공약수!", 400, 42);
        drawBar(180, 62, 5, "최대공약수 6의 약수", "#ec4899");
        drawBar(410, 62, 5, "두 수의 모든 공약수", "#f43f5e");
      }

      const charLineX = 220; const charFriendX = 580; const groundY = 275;
      const lineBubbleOffsetX = (scene === 7 || scene === 8) ? 25 : 15;
      
      drawDoodleChar(charLineX, groundY, 0.9, false, 'normal');
      drawBubble(charLineX, groundY, speechBubble1.text, false, lineBubbleOffsetX);

      drawDoodleChar(charFriendX, groundY, 0.9, true, scene === 8 ? 'doubt' : 'normal');
      drawBubble(charFriendX, groundY, speechBubble2.text, true, -10);
    }

    // 15문제 게임 (scene === 9)
    else if (scene === 9) {
      const q = gameData[gameIndex];

      ctx.fillStyle = "#1e293b"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(`두 수: [ ${q.pair} ]`, 400, 26);

      ctx.fillStyle = "#64748b"; ctx.font = "bold 12px sans-serif";
      ctx.fillText("떨어지는 숫자는 어느 바구니에 들어갈까요?", 400, 44);

      ctx.fillStyle = "#0284c7"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left";
      ctx.fillText(`진행: ${gameIndex + 1} / 15`, 25, 26);
      ctx.fillText(`점수: ${gameScore} 점`, 25, 44);

      const basketGcdX = 240; const basketCdX = 560; const basketY = 225;

      let hoverGcd = (mouseX > 175 && mouseX < 305 && mouseY > 160 && mouseY < 290);
      let hoverCd = (mouseX > 495 && mouseX < 625 && mouseY > 160 && mouseY < 290);

      drawBasket(basketGcdX, basketY, "최대공약수 바구니", "(가장 큰 공약수)", "#ef4444", hoverGcd);
      drawBasket(basketCdX, basketY, "공약수 바구니", "(최대공약수 아닌 공약수)", "#3b82f6", hoverCd);

      drawDoodleChar(100, basketY + 15, 0.85, false, 'normal');
      drawDoodleChar(700, basketY + 15, 0.85, true, 'normal');

      if (gameStatus === 'falling') {
        fallingY += 1.5;
        drawFallingBubble(fallingX, fallingY, q.num, 1.0);

        if (fallingY > 210) {
          gameResultMark = "앗, 놓쳤다! ❌";
          gameResultExp = "화면의 바구니를 직접 클릭해야 해!";
          gameStatus = 'result';
          setTimeout(nextGameQuestion, 1300);
        }
      } 
      else if (gameStatus === 'moving') {
        fallingX += (targetBasketX - fallingX) * 0.15;
        fallingY += (targetBasketY - fallingY) * 0.15;
        fallingScale -= 0.035;

        if (fallingScale <= 0.2) {
          if (gameSelectedType === q.type) {
            gameScore++;
            gameResultMark = "정답! 🎉";
          } else {
            gameResultMark = "오답! ❌";
          }
          gameResultExp = q.exp;
          gameStatus = 'result';
          setTimeout(nextGameQuestion, 1400);
        } else {
          drawFallingBubble(fallingX, fallingY, q.num, Math.max(fallingScale, 0));
        }
      }

      if (gameStatus === 'result' && gameResultMark) {
        ctx.fillStyle = gameResultMark.includes("정답") ? "#16a34a" : "#dc2626";
        ctx.textAlign = "center"; ctx.font = "bold 24px sans-serif";
        ctx.fillText(gameResultMark, 400, 115);
        ctx.fillStyle = "#1e293b"; ctx.font = "bold 14px sans-serif";
        ctx.fillText(gameResultExp, 400, 142);
      }
    }

    // 최종 결과 (scene === 10)
    else if (scene === 10) {
      ctx.fillStyle = "#8e44ad"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(`최종 결과: 15문제 중 ${gameScore}문제 정답!`, 400, 45);

      ctx.fillStyle = "#f8fafc"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      drawRoundedRect(160, 62, 480, 68, 10);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#0f172a"; ctx.font = "bold 13px sans-serif";
      ctx.fillText("★ 핵심 정리 복습", 400, 78);
      ctx.font = "12px sans-serif"; ctx.fillStyle = "#475569";
      ctx.fillText("1. 두 수를 동시에 똑같이 나눌 수 있는 수는 '공약수'", 400, 96);
      ctx.fillText("2. 그 공약수들 중 가장 큰 대장은 '최대공약수'", 400, 113);

      const charLineX = 210; const charFriendX = 590; const groundY = 250;

      drawDoodleChar(charLineX, groundY, 0.85, false, gameScore >= 12 ? 'normal' : 'sigh');
      drawBubble(charLineX, groundY, speechBubble1.text, false, 15);

      drawDoodleChar(charFriendX, groundY, 0.85, true, 'normal');
      drawBubble(charFriendX, groundY, speechBubble2.text, true, -15);
    }

    requestAnimationFrame(render);
  }

  canvas.addEventListener('mousemove', function(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = parseFloat(document.getElementById('game-container').style.transform.replace(/[^0-9.]/g, '') || 1);
    mouseX = ((e.clientX - rect.left) * (canvas.width / rect.width)) / (scale === 0 ? 1 : scale);
    mouseY = ((e.clientY - rect.top) * (canvas.height / rect.height)) / (scale === 0 ? 1 : scale);

    if (scene === 9 && gameStatus === 'falling') {
      if ((mouseX > 175 && mouseX < 305 && mouseY > 160 && mouseY < 290) ||
          (mouseX > 495 && mouseX < 625 && mouseY > 160 && mouseY < 290)) {
        canvas.style.cursor = 'pointer';
      } else {
        canvas.style.cursor = 'default';
      }
    } else {
      canvas.style.cursor = 'default';
    }
  });

  canvas.addEventListener('click', function(e) {
    if (scene !== 9 || gameStatus !== 'falling') return;

    if (mouseX > 175 && mouseX < 305 && mouseY > 160 && mouseY < 290) {
      catchNumber('gcd');
    } else if (mouseX > 495 && mouseX < 625 && mouseY > 160 && mouseY < 290) {
      catchNumber('cd');
    }
  });

  function catchNumber(type) {
    gameSelectedType = type;
    targetBasketX = (type === 'gcd') ? 240 : 560;
    targetBasketY = 225;
    gameStatus = 'moving';
    canvas.style.cursor = 'default';
  }

  function nextGameQuestion() {
    gameIndex++;
    if (gameIndex >= gameData.length) {
      loadScene(10);
    } else {
      statusText.innerText = `🎮 문제 ${gameIndex + 1} / 15 : 알맞은 바구니를 클릭하세요!`;
      fallingX = 400; fallingY = -25; fallingScale = 1.0;
      gameStatus = 'falling';
      gameResultMark = ""; gameResultExp = "";
    }
  }

  // --- 스마트폰 세로 높이에 완벽히 맞춰주는 반응형 엔진 ---
  function resizeGame() {
    const container = document.getElementById('game-container');
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    const scaleX = windowWidth / 820;
    const scaleY = windowHeight / 440;
    const scale = Math.min(scaleX, scaleY);
    
    container.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', resizeGame);
  window.addEventListener('load', resizeGame);

  window.goPrev = function() {
    if (scene > 0) loadScene(scene - 1);
  };

  window.goNext = function() {
    if (scene < 9) loadScene(scene + 1);
  };

  loadScene(0);
  render();
</script>
</body>
</html>

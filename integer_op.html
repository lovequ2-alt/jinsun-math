  // Web Audio 효과음 신디사이저

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.06);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'step') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.09);
        osc.frequency.setValueAtTime(783.99, now + 0.18);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'fanfare') {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const subOsc = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          subOsc.connect(subGain);
          subGain.connect(audioCtx.destination);
          subOsc.frequency.value = freq;
          subGain.gain.setValueAtTime(0.22, now + idx * 0.1);
          subGain.gain.linearRampToValueAtTime(0, now + idx * 0.1 + 0.25);
          subOsc.start(now + idx * 0.1);
          subOsc.stop(now + idx * 0.1 + 0.25);
        });
      }
    } catch (e) {}
  }

      btnNext.innerText = "처음으로 ↺";
      btnNext.style.background = "#16a34a";
    }
  }

  function goNext() {
    playSound('step');
    if (currentScene === 0) {
      if (subStep < 4) {
        subStep++;
      } else {
        currentScene = 1;
        subStep = 0;
      }
    } else if (currentScene === 1) {
      if (subStep < 3) {
        subStep++;
      } else {
        currentScene = 2;
        lineCaseIdx = 0;
        lineStep = 0;
      }
    } else if (currentScene === 2) {
      if (lineStep === 0) {
        lineStep = 1;
      } else {
        if (lineCaseIdx < 2) {
          lineCaseIdx++;
          lineStep = 0;
        } else {
          currentScene = 3;
          quizIndex = 0;
          quizSelectedOption = null;
          quizFeedback = null;
        }
      }
    } else if (currentScene === 3) {
      if (quizFeedback && quizFeedback.isCorrect) {
        if (quizIndex < quizData.length - 1) {
          quizIndex++;
          quizSelectedOption = null;
          quizFeedback = null;
        } else {
          currentScene = 4;
          playSound('fanfare');
        }
      }
    } else if (currentScene === 4) {
      currentScene = 0;
      subStep = 0;
      lineCaseIdx = 0;
      lineStep = 0;
      quizIndex = 0;
      quizSelectedOption = null;
      quizFeedback = null;
    }
    updateUI();
    render();
  }

  function goPrev() {
    playSound('step');
    if (currentScene === 0) {
      if (subStep > 0) subStep--;
    } else if (currentScene === 1) {
      if (subStep > 0) {
        subStep--;
      } else {
        currentScene = 0;
        subStep = 4;
      }
    } else if (currentScene === 2) {
      if (lineStep > 0) {
        lineStep = 0;
      } else {
        if (lineCaseIdx > 0) {
          lineCaseIdx--;
          lineStep = 1;
        } else {
          currentScene = 1;
          subStep = 3;
        }
      }
    } else if (currentScene === 3) {
      if (quizIndex > 0) {
        quizIndex--;
        quizSelectedOption = null;
        quizFeedback = null;
      } else {
        currentScene = 2;
        lineCaseIdx = 2;
        lineStep = 1;
      }
    } else if (currentScene === 4) {
      currentScene = 3;
      quizIndex = quizData.length - 1;
    }
    updateUI();
    render();
  }

  // ==========================================
  // 캐릭터 얼굴 & 말풍선 드로잉 함수
  // ==========================================
  function drawComicFace(ctx, x, y, isFriend = false, mood = 'smile') {
    ctx.save();
    ctx.translate(x, y);

    const r = 24;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = isFriend ? "#7c3aed" : "#1e293b";
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    if (!isFriend) {
      // 주인공 (주황 머리)
      ctx.fillStyle = "#f97316";
      ctx.strokeStyle = "#c2410c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -6, r, Math.PI * 1.1, Math.PI * 1.9);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-16, -14); ctx.lineTo(-6, -26); ctx.lineTo(4, -14); ctx.lineTo(14, -24); ctx.lineTo(18, -12);
      ctx.fillStyle = "#ea580c"; ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#1e293b";
      if (mood === 'shock') {
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(-8, -4, 4.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(8, -4, 4.5, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(-8, -4, 3, 0, Math.PI * 2); ctx.arc(8, -4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
        ctx.beginPath(); ctx.arc(-14, 4, 4, 0, Math.PI * 2); ctx.arc(14, 4, 4, 0, Math.PI * 2); ctx.fill();
      }

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === 'shock') {
        ctx.arc(0, 8, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#1e293b"; ctx.fill();
      } else {
        ctx.arc(0, 3, 7, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }
    } else {
      // 수학 친구 (중절모 쓴 보라 머리 친구)
      ctx.fillStyle = "#475569";
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-22, -26, 44, 6, 3);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.roundRect(-14, -38, 28, 14, 4);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#a855f7";
      ctx.beginPath();
      ctx.arc(0, -6, r, Math.PI * 1.15, Math.PI * 1.85);
      ctx.fill();

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(-8, -2, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(8, -2, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-2, -2); ctx.lineTo(2, -2); ctx.stroke();

      ctx.fillStyle = "#1e293b";
      ctx.beginPath(); ctx.arc(-7, -2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -2, 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 8, 7, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawCompactBubble(ctx, targetX, targetY, text, isFriend = false) {
    ctx.save();
    ctx.font = "bold 13.5px 'Pretendard', sans-serif";
    const lines = text.split("\n");
    let maxW = 0;
    lines.forEach(l => {
      const w = ctx.measureText(l).width;
      if (w > maxW) maxW = w;
    });

    const padX = 14;
    const padY = 9;
    const lineH = 18;
    const bubbleW = maxW + padX * 2;
    const bubbleH = lines.length * lineH + padY * 2;

    let bx, by;
    if (!isFriend) {
      bx = targetX + 34;
      by = targetY - bubbleH / 2;
    } else {
      bx = targetX - 34 - bubbleW;
      by = targetY - bubbleH / 2;
    }

    ctx.fillStyle = isFriend ? "#f5f3ff" : "#fffbeb";
    ctx.strokeStyle = isFriend ? "#7c3aed" : "#f59e0b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bubbleW, bubbleH, 12);
    ctx.fill(); ctx.stroke();

    ctx.beginPath();
    if (!isFriend) {
      ctx.moveTo(bx, targetY - 4);
      ctx.lineTo(bx - 10, targetY);
      ctx.lineTo(bx, targetY + 6);
    } else {
      ctx.moveTo(bx + bubbleW, targetY - 4);
      ctx.lineTo(bx + bubbleW + 10, targetY);
      ctx.lineTo(bx + bubbleW, targetY + 6);
    }
    ctx.fillStyle = isFriend ? "#f5f3ff" : "#fffbeb";
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    lines.forEach((l, i) => {
      ctx.fillText(l, bx + padX, by + padY + i * lineH + lineH / 2);
    });

    ctx.restore();
  }

  // 중앙 정렬 대화형 말풍선 헬퍼 (얼굴 + 말풍선 결합형, 수평 중앙 자동 정렬)
  function drawCenteredComicDialog(ctx, centerX, centerY, text, isFriend = false) {
    ctx.save();
    ctx.font = "bold 13.5px 'Pretendard', sans-serif";
    const lines = text.split("\n");
    let maxW = 0;
    lines.forEach(l => {
      const w = ctx.measureText(l).width;
      if (w > maxW) maxW = w;
    });

    const padX = 16;
    const padY = 8;
    const lineH = 19;
    const bubbleW = maxW + padX * 2;
    const bubbleH = lines.length * lineH + padY * 2;
    const faceR = 22;
    const gap = 12;
    const totalW = faceR * 2 + gap + bubbleW;

    const startX = centerX - totalW / 2;

    let faceX, bx;
    if (!isFriend) {
      // 주인공(주황 머리): 얼굴이 왼쪽, 말풍선이 오른쪽
      faceX = startX + faceR;
      bx = startX + faceR * 2 + gap;
      drawComicFace(ctx, faceX, centerY, false, 'smile');
    } else {
      // 수학 친구(보라 모자): 말풍선이 왼쪽, 얼굴이 오른쪽
      bx = startX;
      faceX = startX + bubbleW + gap + faceR;
      drawComicFace(ctx, faceX, centerY, true, 'smile');
    }

    const by = centerY - bubbleH / 2;

    // 말풍선 본체
    ctx.fillStyle = isFriend ? "#f5f3ff" : "#fffbeb";
    ctx.strokeStyle = isFriend ? "#7c3aed" : "#f59e0b";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(bx, by, bubbleW, bubbleH, 12);
    ctx.fill(); ctx.stroke();

    // 말풍선 꼬리
    ctx.beginPath();
    if (!isFriend) {
      ctx.moveTo(bx, centerY - 4);
      ctx.lineTo(bx - 9, centerY);
      ctx.lineTo(bx, centerY + 5);
    } else {
      ctx.moveTo(bx + bubbleW, centerY - 4);
      ctx.lineTo(bx + bubbleW + 9, centerY);
      ctx.lineTo(bx + bubbleW, centerY + 5);
    }
    ctx.fillStyle = isFriend ? "#f5f3ff" : "#fffbeb";
    ctx.fill(); ctx.stroke();

    // 말풍선 텍스트
    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    lines.forEach((l, i) => {
      ctx.fillText(l, bx + padX, by + padY + i * lineH + lineH / 2);
    });

    ctx.restore();
  }

  // ==========================================
  // [+] 와 [-] 부호 전용 컬러 렌더링 헬퍼 (+: 파란색 #2563eb, -: 빨간색 #dc2626)
  // ==========================================
  function drawColoredMath(ctx, str, x, y, defaultColor = "#0f172a", align = "left") {
    if (!str) return 0;
    ctx.save();

    const tokens = [];
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      if (ch === '+' || ch === '-') {
        tokens.push({ text: ch, isSymbol: true, isPlus: (ch === '+') });
        i++;
      } else {
        let j = i + 1;
        while (j < str.length && str[j] !== '+' && str[j] !== '-') {
          j++;
        }
        tokens.push({ text: str.substring(i, j), isSymbol: false });
        i = j;
      }
    }

    let totalW = 0;
    tokens.forEach(t => {
      t.w = ctx.measureText(t.text).width;
      totalW += t.w;
    });

    let curX = (align === "center") ? x - totalW / 2 : (align === "right" ? x - totalW : x);
    ctx.textAlign = "left";

    tokens.forEach(t => {
      if (t.isSymbol) {
        ctx.fillStyle = t.isPlus ? "#2563eb" : "#dc2626";
      } else {
        ctx.fillStyle = defaultColor;
      }
      ctx.fillText(t.text, curX, y);
      curX += t.w;
    });

    ctx.restore();
    return totalW;
  }

    } else if (currentScene === 3) {

    } else if (currentScene === 4) {

    }
  }

    // 카드 2: 마이너스는 사실 -1 곱하기 (중앙)
    const c2X = 340, c2W = 280;
    if (subStep >= 1) {
      ctx.fillStyle = "#eff6ff";
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(c2X, cardY, c2W, cardH, 16);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#2563eb";
      ctx.beginPath();
      ctx.roundRect(c2X + 16, cardY + 16, 170, 26, 8);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px 'Pretendard', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("2. -(-5) 는 -1 × (-5) ⚡", c2X + 101, cardY + 33);

      ctx.font = "bold 17px 'Pretendard', sans-serif";
      drawColoredMath(ctx, "- ( -5 )  의 진짜 의미!", c2X + c2W / 2, cardY + 80, "#0f172a", "center");

      ctx.font = "bold 18px 'Pretendard', sans-serif";
      drawColoredMath(ctx, "=  -1 × (-5)", c2X + c2W / 2, cardY + 120, "#dc2626", "center");

      ctx.font = "bold 18px 'Pretendard', sans-serif";
      drawColoredMath(ctx, "=  +5", c2X + c2W / 2, cardY + 155, "#1d4ed8", "center");

      ctx.fillStyle = "#475569";
      ctx.font = "13px 'Pretendard', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("마이너스(-) 부호는", c2X + c2W / 2, cardY + 195);
      ctx.fillText("오직 바로 뒤의 숫자에 -1을 곱해", c2X + c2W / 2, cardY + 218);
      ctx.fillText("방향을 180° 싹 바꾸는 마법이야!", c2X + c2W / 2, cardY + 246);
      ctx.fillText("진짜 이유가 바로 -1 곱하기 원리!", c2X + c2W / 2, cardY + 273);

      ctx.font = "bold 13px 'Pretendard', sans-serif";
      drawColoredMath(ctx, "👉 (-1) × (-5) = +5 !", c2X + c2W / 2, cardY + 315, "#2563eb", "center");
    } else {
      drawLockedBox(c2X, cardY, c2W, cardH, "🔒 [다음 ▶] 버튼을 누르면\n- (-5) 와 -1×(-5) 의\n비밀이 공개됩니다!");
    }

    // 카드 3: (-5)³ 거듭제곱의 원리 (우측)
    const c3X = 635, c3W = 280;
    if (subStep >= 2) {
      ctx.fillStyle = "#faf5ff";
      ctx.strokeStyle = "#7c3aed";
      ctx.lineWidth = 2.2;

      drawColoredMath(ctx, "• (-1)의 홀수 제곱 ➔ (-)", c3X + c3W / 2, cardY + 258, "#475569", "center");
      drawColoredMath(ctx, "• (-1)의 짝수 제곱 ➔ (+)", c3X + c3W / 2, cardY + 278, "#475569", "center");
      drawColoredMath(ctx, "예: (-5)² = +25 (짝수 제곱은 +!)", c3X + c3W / 2, cardY + 298, "#059669", "center");
    } else {
      drawLockedBox(c3X, cardY, c3W, cardH, "🔒 [다음 ▶] 버튼을 누르면\n(-5)³ 거듭제곱의\n부호 원리가 공개됩니다!");

      drawComicFace(ctx, 65, 485, false, 'smile');

      drawComicFace(ctx, 895, 485, true, 'smile');
      drawCompactBubble(ctx, 895, 485, "정확해! 앞 숫자는 그대로! 뒤의 숫자만 싹 바꾸지!\n이제 수직선 위에서 직접 뛰어보자! 🏃", true);

  // ==========================================
  // [화면 3] 수직선 대모험: 방향 전환 사례 a, b, c (간결하고 직관적인 핵심 중심 연출)
  // ==========================================
  function renderSceneNumberLine() {
    const cx = canvas.width / 2;

    // 상단 타이틀
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 21px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🏃 수직선 대모험: 가운데 '-'를 만나면 180° 방향 바꿔!", cx, 32);

    // 상단 탭 (사례 a, b, c 간결 선택)
    const tabCases = [
      { id: 0, badge: "사례 a", eq: "+5 + (-3)" },
      { id: 1, badge: "사례 b", eq: "+5 - (-3)" },
      { id: 2, badge: "사례 c", eq: "-5 - (+3)" }
    ];

    const tabY = 50;
    const tabW = 265;
    const tabH = 36;
    const tabGap = 16;
    const totalTabW = 3 * tabW + 2 * tabGap;
    const startTabX = cx - totalTabW / 2;

    tabCases.forEach((tc, idx) => {
      const tx = startTabX + idx * (tabW + tabGap);
      const isSelected = (lineCaseIdx === idx);

      ctx.fillStyle = isSelected ? "#eff6ff" : "#f8fafc";
      ctx.strokeStyle = isSelected ? "#2563eb" : "#cbd5e1";
      ctx.lineWidth = isSelected ? 2.2 : 1.2;
      ctx.beginPath();
      ctx.roundRect(tx, tabY, tabW, tabH, 10);
      ctx.fill(); ctx.stroke();

      tabHitBoxes.push({ idx: idx, x: tx, y: tabY, w: tabW, h: tabH });

      // 배지
      const tBadgeW = 68;
      const tBadgeX = tx + 10;
      ctx.fillStyle = isSelected ? "#2563eb" : "#64748b";
      ctx.beginPath();
      ctx.roundRect(tBadgeX, tabY + 5, tBadgeW, 26, 6);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px 'Pretendard', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(tc.badge, tBadgeX + tBadgeW / 2, tabY + 22);

      // 탭 수식
      ctx.font = "bold 15px 'Pretendard', sans-serif";
      drawColoredMath(ctx, tc.eq, tx + 170, tabY + 23, isSelected ? "#1e40af" : "#475569", "center");
    });

    // 메인 카드
    const cardX = 45, cardY = 96, cardW = 870, cardH = 422;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 16);
    ctx.fill(); ctx.stroke();

    // ----------------------------------------------------
    // 1) 중앙 핵심 문제 수식 (시선이 가장 먼저 머무는 중심 수식)
    // ----------------------------------------------------
    const eqData = [
      {
        step0Eq: "+5 + (-3) = ?",
        step1Eq: "+5 + (-3) = +2",
        step0Talk: "0에서 출발해 +5에 도착했어!\n-3을 '+' 하면 어디로 갈까?",
        step1Talk: "가운데 +와 뒤의 -가 만나 뒤로 3칸 후진!\n앞의 5는 그대로 두고 +2 도착이야! 🎯"
      },
      {
        step0Eq: "+5 - (-3) = ?",
        step1Eq: "+5 - (-3) = +8",
        step0Talk: "0에서 출발해 +5에 도착했어!\n-3을 '-' 하면 어디로 갈까?",
        step1Talk: "- 부호 2개가 연속으로 만나 앞 방향(+) 변신!\n앞으로 3칸 전진해서 +8 도착이야! 🚀"
      },
      {
        step0Eq: "-5 - (+3) = ?",
        step1Eq: "-5 - (+3) = -8",
        step0Talk: "0에서 출발해 왼쪽 -5에 섰어!\n+3을 '-' 하면 어디로 갈까?",
        step1Talk: "가운데 -가 뒤의 +를 뒤집어 왼쪽으로!\n3칸 더 후진해서 -8 도착이야! 🎯"
      }
    ];

    const curEqInfo = eqData[lineCaseIdx];
    const curEq = (lineStep === 0) ? curEqInfo.step0Eq : curEqInfo.step1Eq;

    // 중앙 수식 박스
    const boxW = 340, boxH = 44;
    const boxX = cx - boxW / 2;
    const boxY = cardY + 16;
    ctx.fillStyle = (lineStep === 0) ? "#f8fafc" : "#f0fdf4";
    ctx.strokeStyle = (lineStep === 0) ? "#cbd5e1" : "#16a34a";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, 12);
    ctx.fill(); ctx.stroke();

    ctx.font = "bold 26px 'Pretendard', sans-serif";
    drawColoredMath(ctx, curEq, cx, boxY + 31, "#0f172a", "center");

    // ----------------------------------------------------
    // 2) 캐릭터 말풍선 대화 (중앙 자동 정렬 & 겹침 100% 원천 차단)
    // 0단계(출발): 왼쪽 주황 머리 주인공이 질문
    // 1단계(결과): 오른쪽 보라 모자 친구가 명쾌한 해답 제시
    // ----------------------------------------------------
    const dialogY = cardY + 98; // y = 194
    const talkText = (lineStep === 0) ? curEqInfo.step0Talk : curEqInfo.step1Talk;
    drawCenteredComicDialog(ctx, cx, dialogY, talkText, (lineStep === 1));

    // ----------------------------------------------------
    // 3) 수직선 본체 (y = 318, 눈금 간격 38px)
    // ----------------------------------------------------
    const lineY = 318;
    const lineLeft = cardX + 35;
    const lineRight = cardX + cardW - 35;
    const originX = cardX + cardW / 2; // x = 480 (0의 위치)
    const unitStep = 38;

    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(lineLeft, lineY);
    ctx.lineTo(lineRight, lineY);
    ctx.stroke();

    // 양쪽 끝 화살표
    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(lineRight - 10, lineY - 6);
    ctx.lineTo(lineRight, lineY);
    ctx.lineTo(lineRight - 10, lineY + 6);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(lineLeft + 10, lineY - 6);
    ctx.lineTo(lineLeft, lineY);
    ctx.lineTo(lineLeft + 10, lineY + 6);
    ctx.fill();

    // 눈금 및 숫자 라벨 (-10 ~ +10)
    for (let n = -10; n <= 10; n++) {
      const nx = originX + n * unitStep;
      if (nx < lineLeft + 15 || nx > lineRight - 15) continue;

      const isOrigin = (n === 0);
      const isMajor = (n % 5 === 0);

      ctx.strokeStyle = isOrigin ? "#0f172a" : (isMajor ? "#64748b" : "#cbd5e1");
      ctx.lineWidth = isOrigin ? 3.5 : (isMajor ? 2 : 1.2);
      ctx.beginPath();
      ctx.moveTo(nx, lineY - (isMajor ? 10 : 6));
      ctx.lineTo(nx, lineY + (isMajor ? 10 : 6));
      ctx.stroke();

      ctx.font = isOrigin ? "bold 15px 'Pretendard', sans-serif" : (isMajor ? "bold 13.5px 'Pretendard', sans-serif" : "12px 'Pretendard', sans-serif");
      ctx.textAlign = "center";
      if (isOrigin) {
        ctx.fillStyle = "#0f172a";
        ctx.fillText("0", nx, lineY + 24);
      } else if (n > 0) {
        ctx.fillStyle = isMajor ? "#2563eb" : "#64748b";
        ctx.fillText("+" + n, nx, lineY + 24);
      } else {
        ctx.fillStyle = isMajor ? "#dc2626" : "#64748b";
        ctx.fillText(n.toString(), nx, lineY + 24);
      }
    }

    // ----------------------------------------------------
    // 4) 사례별 점프 호선 및 핀 마커
    // ----------------------------------------------------
    if (lineCaseIdx === 0) {
      // 1단계: 0에서 +5 점프 (높은 호선, 높이 56)
      drawJumpArc(originX, originX + 5 * unitStep, lineY, true, "+5 만큼 출발 ➔", "#2563eb", false, 56);
      drawPinMarker(originX + 5 * unitStep, lineY, "📍 +5 (출발)", "#2563eb");

      // 2단계: +5에서 +2로 후진 (낮은 호선, 높이 34)
      if (lineStep >= 1) {
        drawJumpArc(originX + 5 * unitStep, originX + 2 * unitStep, lineY, true, "⮌ 뒤돌아 3칸 후진 (-3)", "#dc2626", true, 34);
        drawTargetPin(originX + 2 * unitStep, lineY, "🎯 +2 도착!", "#16a34a");
      }

    } else if (lineCaseIdx === 1) {
      // 1단계: 0에서 +5 점프
      drawJumpArc(originX, originX + 5 * unitStep, lineY, true, "+5 만큼 출발 ➔", "#2563eb", false, 56);
      drawPinMarker(originX + 5 * unitStep, lineY, "📍 +5 (출발)", "#2563eb");

      // 2단계: +5에서 +8로 전진
      if (lineStep >= 1) {
        drawJumpArc(originX + 5 * unitStep, originX + 8 * unitStep, lineY, true, "➔ 앞 방향으로 3칸 전진 (+3)", "#059669", false, 34);
        drawTargetPin(originX + 8 * unitStep, lineY, "🎯 +8 도착!", "#059669");
      }

    } else if (lineCaseIdx === 2) {
      // 1단계: 0에서 -5 점프
      drawJumpArc(originX, originX - 5 * unitStep, lineY, true, "⮌ -5 위치로 출발", "#ea580c", false, 56);
      drawPinMarker(originX - 5 * unitStep, lineY, "📍 -5 (출발)", "#ea580c");

      // 2단계: -5에서 -8로 더 왼쪽으로 3칸
      if (lineStep >= 1) {
        drawJumpArc(originX - 5 * unitStep, originX - 8 * unitStep, lineY, true, "⮌ 왼쪽으로 3칸 더 (-3)", "#dc2626", true, 34);
        drawTargetPin(originX - 8 * unitStep, lineY, "🎯 -8 도착!", "#dc2626");
      }
    }

    // ----------------------------------------------------
    // 5) 카드 하단 핵심 공식 안내 띠 (차분한 고정 앵커)
    // ----------------------------------------------------
    const barY = cardY + 364; // y = 460
    const barW = cardW - 48; // 822
    const barX = cardX + 24;

    if (lineStep >= 1) {
      ctx.fillStyle = "#eff6ff";
      ctx.strokeStyle = "#bfdbfe";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, 40, 10);
      ctx.fill(); ctx.stroke();

      ctx.font = "bold 13.5px 'Pretendard', sans-serif";
      drawColoredMath(ctx, "💡 핵심 공식: 앞의 수는 그대로! 가운데 '-' 부호가 [바로 뒤의 숫자] 방향만 180° 바꾼다!", cx, barY + 25, "#1e40af", "center");
    } else {
      ctx.fillStyle = "#f8fafc";
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, 40, 10);
      ctx.fill(); ctx.stroke();

      ctx.font = "bold 13px 'Pretendard', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#64748b";
      ctx.fillText("👉 아래 [방향 전환 & 정답 보기 ▶] 버튼을 누르면 부호 변화와 도착 위치가 공개됩니다!", cx, barY + 25);
    }
  }

  // 중간 지점 핀 마커 드로잉 헬퍼
  function drawPinMarker(x, y, label, color, isTop = false) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "bold 13px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + 45);
    ctx.restore();
  }

  // 수직선 점프 호선 드로잉 헬퍼 (customHeight, textOffsetX, textOffsetY 지원)
  function drawJumpArc(x1, x2, baseY, isUp, text, color, isDashed = false, customHeight = null, textOffsetX = 0, textOffsetY = 0) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.8;
    if (isDashed) ctx.setLineDash([6, 4]);

    const arcHeight = (customHeight !== null) ? customHeight : Math.min(48, Math.abs(x2 - x1) * 0.35 + 18);
    const cpY = isUp ? baseY - arcHeight : baseY + arcHeight;

    ctx.beginPath();
    ctx.moveTo(x1, baseY);
    ctx.quadraticCurveTo((x1 + x2) / 2, cpY, x2, baseY);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x2, baseY - 2, 4.5, 0, Math.PI * 2);
    ctx.fill();

    const midX = (x1 + x2) / 2 + textOffsetX;
    ctx.font = "bold 12.5px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.fillText(text, midX, cpY - 6 + textOffsetY);

    ctx.restore();
  }

  // 최종 도착지 깃발 드로잉 헬퍼
  function drawTargetPin(x, y, label, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 6.5, 0, Math.PI * 2);
    ctx.fill();

    // 깃발 대
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - 24);
    ctx.stroke();

    // 깃발 삼각
    ctx.beginPath();
    ctx.moveTo(x, y - 24);
    ctx.lineTo(x + 18, y - 18);
    ctx.lineTo(x, y - 12);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.font = "bold 13px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + 45);
    ctx.restore();
  }

  // 잠금 카드 헬퍼
  function drawLockedBox(x, y, w, h, text) {
    ctx.fillStyle = "#f8fafc";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 14);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 14px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    const lines = text.split("\n");
    lines.forEach((l, idx) => {
      ctx.fillText(l, x + w / 2, y + h / 2 - 10 + idx * 22);
    });
  }

  // ==========================================
  // [화면 4] 실전 10대 킬러 퀴즈
  // ==========================================
  function renderSceneQuiz() {
    const cx = canvas.width / 2;
    const q = quizData[quizIndex];

    ctx.fillStyle = "#2563eb";
    ctx.font = "bold 15px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`Q${quizIndex + 1}. [${q.badge}]`, 50, 36);

    ctx.fillStyle = "#64748b";
    ctx.font = "14px 'Pretendard', sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(`진행: ${quizIndex + 1} / ${quizData.length}`, 910, 36);

    const mainBoxY = 52;
    const mainBoxH = 135;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(50, mainBoxY, 860, mainBoxH, 16);
    ctx.fill(); ctx.stroke();

    ctx.font = "bold 32px 'Pretendard', sans-serif";
    drawColoredMath(ctx, q.rawEq + " = ?", cx, mainBoxY + 52, "#0f172a", "center");

    ctx.fillStyle = "#475569";
    ctx.font = "15px 'Pretendard', sans-serif";
    ctx.fillText(q.question, cx, mainBoxY + 84);

    ctx.fillStyle = "#eff6ff";
    ctx.strokeStyle = "#bfdbfe";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(cx - 260, mainBoxY + 98, 520, 26, 8);
    ctx.fill(); ctx.stroke();

    ctx.font = "bold 13px 'Pretendard', sans-serif";
    drawColoredMath(ctx, "💡 부호 규칙: " + q.signTip, cx, mainBoxY + 115, "#1d4ed8", "center");

    const optY = 205;
    const optH = 58;
    const optGap = 12;
    const optW = 860;

    q.options.forEach((opt, idx) => {
      const cy = optY + idx * (optH + optGap);
      const isSelected = (quizSelectedOption === idx);

      let cardBg = "#ffffff";
      let cardBorder = "#e2e8f0";
      let textColor = "#0f172a";

      if (quizFeedback) {
        if (opt.isCorrect) {
          cardBg = "#f0fdf4";
          cardBorder = "#16a34a";
          textColor = "#15803d";
        } else if (isSelected && !opt.isCorrect) {
          cardBg = "#fef2f2";
          cardBorder = "#dc2626";
          textColor = "#991b1b";
        }
      } else if (isSelected) {
        cardBg = "#eff6ff";
        cardBorder = "#2563eb";
      }

      ctx.fillStyle = cardBg;
      ctx.strokeStyle = cardBorder;
      ctx.lineWidth = isSelected || (quizFeedback && opt.isCorrect) ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.roundRect(50, cy, optW, optH, 12);
      ctx.fill(); ctx.stroke();

      optionHitBoxes.push({ idx: idx, x: 50, y: cy, w: optW, h: optH });

      const labels = ["A", "B", "C"];
      ctx.fillStyle = isSelected || (quizFeedback && opt.isCorrect) ? cardBorder : "#64748b";
      ctx.beginPath();
      ctx.roundRect(65, cy + 12, 34, 34, 8);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px 'Pretendard', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(labels[idx], 82, cy + 34);

      ctx.font = "bold 20px 'Pretendard', sans-serif";
      drawColoredMath(ctx, opt.text, 118, cy + 36, textColor, "left");

      if (quizFeedback && (opt.isCorrect || isSelected)) {
        ctx.font = "bold 13.5px 'Pretendard', sans-serif";
        ctx.fillStyle = opt.isCorrect ? "#15803d" : "#dc2626";
        ctx.textAlign = "right";
        ctx.fillText(opt.desc, 50 + optW - 20, cy + 35);
      }
    });

    const bottomY = 465;
    if (quizFeedback) {
      if (quizFeedback.isCorrect) {
        drawComicFace(ctx, 65, bottomY, false, 'smile');
        drawCompactBubble(ctx, 65, bottomY, "우와! 부호가 만나서 합쳐지는 규칙을\n정확히 꿰뚫어 봤네! 나이스! 🎯", false);

        drawComicFace(ctx, 895, bottomY, true, 'smile');
        drawCompactBubble(ctx, 895, bottomY, "정답이야! 핵심은 " + q.ruleRef + "!\n아래 [다음 ▶] 버튼 누르고 넘어가자! 🚀", true);
      } else {
        drawComicFace(ctx, 65, bottomY, false, 'shock');
        drawCompactBubble(ctx, 65, bottomY, "으악! 부호 충돌에서 살짝 낚였어 💣\n다시 확인해보고 초록색 정답을 기억하자!", false);

        drawComicFace(ctx, 895, bottomY, true, 'smile');
        drawCompactBubble(ctx, 895, bottomY, "괜찮아! " + q.ruleRef + "!\n한 번 실수하고 나면 절대 안 틀려! 💪", true);
      }
    } else {
      drawComicFace(ctx, 65, bottomY, false, 'smile');
      drawCompactBubble(ctx, 65, bottomY, "두 부호가 만나 하나의 부호로 합쳐지는 모습!\n어느 보기가 진짜 정답일까?", false);

      drawComicFace(ctx, 895, bottomY, true, 'smile');
      drawCompactBubble(ctx, 895, bottomY, "같은 부호면 +, 다른 부호면 -!\n차분하게 골라봐! 👇", true);
    }
  }

  // ==========================================
  // [화면 5] 최종 결과 및 정복 축하
  // ==========================================
  function renderSceneResult() {
    const cx = canvas.width / 2;

    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 26px 'Pretendard', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🎉 축하합니다! +와 - 정수 연산 10대 함정 정복! 🎉", cx, 65);

    ctx.fillStyle = "#2563eb";
    ctx.font = "bold 18px 'Pretendard', sans-serif";
    ctx.fillText("두 부호가 만날 때의 규칙과 거듭제곱까지 완벽 마스터했습니다!", cx, 105);

    const sumW = 860;
    const sumH = 180;
    const sumY = 135;
    ctx.fillStyle = "#f8fafc";
    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(50, sumY, sumW, sumH, 16);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#1e293b";
    ctx.font = "bold 16px 'Pretendard', sans-serif";
    ctx.fillText("⭐ 꼭 기억할 정수 부호 연산 3대 황금 열쇠 ⭐", cx, sumY + 36);

    const bullets = [
      "1. 같은 부호끼리 만나면 (+) :  - 와 - 가 만나면 (+),  + 와 + 가 만나면 (+)",
      "2. 서로 다른 부호끼리 만나면 (-) :  + 와 - 가 만나면 (-),  - 와 + 가 만나면 (-)",
      "3. 괄호와 곱하기의 비밀 :  - (-5) = -1 × (-5) = +5  (음수의 홀수 거듭제곱은 -, 짝수 제곱은 +)",
      "4. 수직선 방향 전환 :  잘 가다가 마이너스(-)를 만나면 180도 방향 전환!  -를 2번 만나면 원래 방향(+)"
    ];

    bullets.forEach((b, idx) => {
      ctx.fillStyle = "#334155";
      ctx.font = "14px 'Pretendard', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(b, 75, sumY + 70 + idx * 26);
    });

    drawComicFace(ctx, 80, 395, false, 'smile');
    drawCompactBubble(ctx, 80, 395, "대박 ㅋㅋㅋ 10문제 전부 완벽 정복!\n이제 부호가 겹치거나 거듭제곱이 나와도 절대 안 헷갈려!", false);

    drawComicFace(ctx, 880, 395, true, 'smile');
    drawCompactBubble(ctx, 880, 395, "너 진짜 실력 완벽하다!\n학교 시험에서도 100점 맞을 거야! 🚀", true);
  }

  // ==========================================
  // 마우스 클릭 이벤트
  // ==========================================
  canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    if (currentScene === 2) {
      for (const tab of tabHitBoxes) {
        if (mx >= tab.x && mx <= tab.x + tab.w && my >= tab.y && my <= tab.y + tab.h) {
          playSound('click');
          lineCaseIdx = tab.idx;
          lineStep = 0; // 탭 전환 시 출발 상태로 리셋
          updateUI();
          render();
          break;
        }
      }
    } else if (currentScene === 3) {
      for (const box of optionHitBoxes) {
        if (mx >= box.x && mx <= box.x + box.w && my >= box.y && my <= box.y + box.h) {
          selectOption(box.idx);
          break;
        }
      }
    }
  });

  function selectOption(idx) {
    if (quizFeedback && quizFeedback.isCorrect) return;

    quizSelectedOption = idx;
    const q = quizData[quizIndex];
    const isCorr = q.options[idx].isCorrect;

    quizFeedback = { isCorrect: isCorr };

    if (isCorr) {
      playSound('correct');
    } else {
      playSound('wrong');
    }

    updateUI();
    render();
  }

  // 초기 렌더링
  updateUI();
  render();
</script>
</body>
</html>
